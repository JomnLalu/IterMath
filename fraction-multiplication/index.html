<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Multiplying and dividing fractions practice · IterMath</title>
  <meta name="description" content="Multiply and divide fractions and whole numbers, and find a fraction of an amount. Instant feedback and a worked solution for every miss.">
  <link rel="canonical" href="https://itermath.jomontolalu.com/fraction-multiplication">
  <meta name="theme-color" content="#fafafa">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="IterMath">
  <meta property="og:title" content="Multiplying and dividing fractions practice · IterMath">
  <meta property="og:description" content="Multiply and divide fractions and whole numbers, and find a fraction of an amount. Instant feedback and a worked solution for every miss.">
  <meta property="og:url" content="https://itermath.jomontolalu.com/fraction-multiplication">
  <meta property="og:image" content="https://itermath.jomontolalu.com/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="container container--narrow topbar">
    <a class="back" href="/" aria-label="All modules"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg><img src="/assets/itermath-logo.svg" alt="" width="104" height="37"></a>
  </header>

  <main class="container container--narrow">
    <div class="practice-header">
      <p class="eyebrow small muted">Fractions and decimals · Grades 5–6</p>
      <h1 class="h1">Multiplying and dividing fractions</h1>
      <p class="lead">Multiply and divide fractions and whole numbers, and find a fraction of an amount.</p>
    </div>

    <section class="card panel" aria-label="Exercise">
      <p id="question" class="question" aria-live="polite"></p>
      <form id="form" novalidate autocomplete="off">
        <label for="answer" class="visually-hidden">Your answer</label>
        <div class="answer-row">
          <input id="answer" class="input" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="Answer" aria-describedby="hint error">
          <button id="action" class="btn" type="submit">Check</button>
        </div>
        <p id="hint" class="field-hint small muted">Simplest form. Type 5/6 or a mixed number like 1 1/4.</p>
        <p id="error" class="field-error" role="alert" hidden></p>
      </form>
      <div id="feedback" class="feedback" aria-live="polite"></div>
    </section>
  </main>

  <script src="/assets/practice.js"></script>
  <script>
    (function (M) {
      M.practice({
        input: 'number',
        generate: function () {
          function proper(maxd) { var d = M.rand(2, maxd), x; do { x = M.rand(1, d - 1); } while (M.gcd(x, d) !== 1); return [x, d]; }
          var t = M.rand(1, 5), a = proper(10), b = proper(10), w, ans, q, rows;
          if (t === 1) {
            ans = M.Q(a[0] * b[0], a[1] * b[1]);
            q = M.frac(a[0], a[1]) + ' × ' + M.frac(b[0], b[1]);
            rows = [[q, '= ' + M.frac(a[0] + ' × ' + b[0], a[1] + ' × ' + b[1])], ['', '= ' + M.frac(a[0] * b[0], a[1] * b[1])]];
          } else if (t === 2) {
            w = M.rand(2, 12);
            ans = M.Q(w * a[0], a[1]);
            q = w + ' × ' + M.frac(a[0], a[1]);
            rows = [[q, '= ' + M.frac(w + ' × ' + a[0], a[1])], ['', '= ' + M.frac(w * a[0], a[1])]];
          } else if (t === 3) {
            ans = M.Q(a[0] * b[1], a[1] * b[0]);
            q = M.frac(a[0], a[1]) + ' ÷ ' + M.frac(b[0], b[1]);
            rows = [[q, '= ' + M.frac(a[0], a[1]) + ' × ' + M.frac(b[1], b[0])], ['', '= ' + M.frac(a[0] * b[1], a[1] * b[0])]];
          } else if (t === 4) {
            w = M.rand(2, 9);
            if (Math.random() < .5) {
              ans = M.Q(a[0], a[1] * w);
              q = M.frac(a[0], a[1]) + ' ÷ ' + w;
              rows = [[q, '= ' + M.frac(a[0], a[1]) + ' × ' + M.frac(1, w)], ['', '= ' + M.frac(a[0], a[1] * w)]];
            } else {
              ans = M.Q(w * a[1], a[0]);
              q = w + ' ÷ ' + M.frac(a[0], a[1]);
              rows = [[q, '= ' + w + ' × ' + M.frac(a[1], a[0])], ['', '= ' + M.frac(w * a[1], a[0])]];
            }
          } else {
            var k = M.rand(2, 9), amount = a[1] * k;
            ans = M.Q(a[0] * k, 1);
            q = M.frac(a[0], a[1]) + ' of ' + amount;
            rows = [[q, '= ' + amount + ' ÷ ' + a[1] + ' × ' + a[0]], ['', '= ' + k + ' × ' + a[0]]];
          }
          rows.push(['', '= <strong>' + M.q(ans, true) + '</strong>']);
          var note = t === 3 || t === 4 ? 'To divide, multiply by the reciprocal (flip the second number).' : t === 5 ? '“Of” means multiply: divide by the denominator, then multiply by the numerator.' : 'Multiply the tops, multiply the bottoms, then simplify.';
          return { question: q, answer: ans, display: M.q(ans, true), solution: M.steps(rows) + M.note(note) };
        }
      });
    })(IterMath);
  </script>
</body>
</html>
