<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Unit conversion practice · IterMath</title>
  <meta name="description" content="Convert metric and customary units of length, mass, capacity and time. Instant feedback and a worked solution for every miss.">
  <link rel="canonical" href="https://itermath.jomontolalu.com/unit-conversion">
  <meta name="theme-color" content="#fafafa">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="IterMath">
  <meta property="og:title" content="Unit conversion practice · IterMath">
  <meta property="og:description" content="Convert metric and customary units of length, mass, capacity and time. Instant feedback and a worked solution for every miss.">
  <meta property="og:url" content="https://itermath.jomontolalu.com/unit-conversion">
  <meta property="og:image" content="https://itermath.jomontolalu.com/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="container container--narrow topbar">
    <a class="back" href="/" aria-label="All modules"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg><img src="/assets/itermath-logo.svg" alt="" width="104" height="37"></a>
  </header>

  <main class="container container--narrow">
    <div class="practice-header">
      <p class="eyebrow small muted">Geometry and measurement · Grades 3–6</p>
      <h1 class="h1">Unit conversion</h1>
      <p class="lead">Convert metric and customary units of length, mass, capacity and time.</p>
    </div>

    <section class="card panel" aria-label="Exercise">
      <p id="question" class="question" aria-live="polite"></p>
      <form id="form" novalidate autocomplete="off">
        <label for="answer" class="visually-hidden">Your answer</label>
        <div class="answer-row">
          <input id="answer" class="input" type="text" inputmode="decimal" enterkeyhint="done" placeholder="Answer" aria-describedby="hint error">
          <button id="action" class="btn" type="submit">Check</button>
        </div>
        <p id="hint" class="field-hint small muted" hidden></p>
        <p id="error" class="field-error" role="alert" hidden></p>
      </form>
      <div id="feedback" class="feedback" aria-live="polite"></div>
    </section>
  </main>

  <script src="/assets/practice.js"></script>
  <script>
    (function (M) {
      M.practice({
        input: 'number',
        generate: function () {
          var n = M.num;
          var table = [
            ['km', 'm', 1000, true], ['m', 'cm', 100, true], ['cm', 'mm', 10, true], ['m', 'mm', 1000, true],
            ['kg', 'g', 1000, true], ['L', 'mL', 1000, true],
            ['hours', 'minutes', 60], ['minutes', 'seconds', 60], ['days', 'hours', 24], ['weeks', 'days', 7], ['years', 'months', 12],
            ['ft', 'in', 12], ['yd', 'ft', 3], ['lb', 'oz', 16], ['gal', 'qt', 4], ['qt', 'pt', 2]
          ];
          var row = M.pick(table), big = row[0], small = row[1], f = row[2], metric = row[3], value, ans, rows;
          if (Math.random() < .5) {
            value = metric && Math.random() < .4 ? M.rand(11, 99) / 10 : M.rand(2, 25);
            if (metric && value !== Math.round(value) && (value * f) % 1) value = Math.round(value);
            ans = M.round(value * f, 6);
            rows = [['1 ' + big.replace(/s$/, ''), '= ' + f + ' ' + small], [n(value) + ' ' + big, '= ' + n(value) + ' × ' + f + ' = <strong>' + n(ans) + ' ' + small + '</strong>']];
            return { question: n(value) + ' ' + big, ask: '= <span class="muted">?</span> ' + small, answer: ans, display: n(ans) + ' ' + small, solution: M.steps(rows) + M.note('Going to a smaller unit, multiply.') };
          }
          ans = metric && Math.random() < .5 ? M.rand(11, 99) / 10 : M.rand(2, 25);
          value = M.round(ans * f, 6);
          rows = [['1 ' + big.replace(/s$/, ''), '= ' + f + ' ' + small], [n(value) + ' ' + small, '= ' + n(value) + ' ÷ ' + f + ' = <strong>' + n(ans) + ' ' + big + '</strong>']];
          return { question: n(value) + ' ' + small, ask: '= <span class="muted">?</span> ' + big, answer: ans, display: n(ans) + ' ' + big, solution: M.steps(rows) + M.note('Going to a larger unit, divide.') };
        }
      });
    })(IterMath);
  </script>
</body>
</html>
