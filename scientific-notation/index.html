<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Scientific notation practice · IterMath</title>
  <meta name="description" content="Convert to and from a × 10^n, and multiply numbers in scientific notation. Instant feedback and a worked solution for every miss.">
  <link rel="canonical" href="https://itermath.jomontolalu.com/scientific-notation">
  <meta name="theme-color" content="#fafafa">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="IterMath">
  <meta property="og:title" content="Scientific notation practice · IterMath">
  <meta property="og:description" content="Convert to and from a × 10^n, and multiply numbers in scientific notation. Instant feedback and a worked solution for every miss.">
  <meta property="og:url" content="https://itermath.jomontolalu.com/scientific-notation">
  <meta property="og:image" content="https://itermath.jomontolalu.com/assets/og.png">

</head>
<body>
  <header class="container container--narrow topbar">
    <a class="back" href="/" aria-label="All modules"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg><img src="/assets/itermath-logo.svg" alt="" width="104" height="37"></a>
  </header>

  <main class="container container--narrow">
    <div class="practice-header">
      <p class="eyebrow small muted">Algebra · Grades 8–9</p>
      <h1 class="h1">Scientific notation</h1>
      <p class="lead">Convert to and from a × 10<sup>n</sup>, and multiply numbers in scientific notation.</p>
    </div>

    <section class="card panel" aria-label="Exercise">
      <p id="question" class="question" aria-live="polite"></p>
      <form id="form" novalidate autocomplete="off">
        <label for="answer" class="visually-hidden">Your answer</label>
        <div class="answer-row">
          <input id="answer" class="input" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="Answer" aria-describedby="hint error">
          <button id="action" class="btn" type="submit">Check</button>
        </div>
        <p id="hint" class="field-hint small muted" hidden></p>
        <p id="error" class="field-error" role="alert" hidden></p>
      </form>
      <div id="feedback" class="feedback" aria-live="polite"></div>
    </section>
  </main>

  <script src="/assets/practice.js"></script>
  <script>
    (function (M) {
      M.practice({
        input: 'number',
        generate: function () {
          var n = M.num, t = M.rand(1, 3);
          var zeros = function (k) { return new Array(k + 1).join('0'); };
          function std(m, e) {
            var digits = m.replace('.', ''), point = 1 + e;
            if (point <= 0) return '0.' + zeros(-point) + digits;
            if (point >= digits.length) return parseInt(digits + zeros(point - digits.length), 10).toLocaleString('en-US');
            return digits.slice(0, point) + '.' + digits.slice(point);
          }
          var mi = M.rand(11, 99); if (mi % 10 === 0) mi++;
          var m = Math.random() < .3 ? String(M.rand(2, 9)) : (mi / 10).toFixed(1), e = M.randNZ(-5, 7);
          var sci = function (mm, ee) { return mm + ' × ' + M.pow(10, n(ee)); };
          if (t === 1) {
            return {
              prompt: 'Write in scientific notation.', question: std(m, e), ask: '= ' + m + ' × ' + M.pow(10, '<span class="muted">?</span>'), answer: e, display: sci(m, e),
              solution: M.steps([[std(m, e), '= <strong>' + sci(m, e) + '</strong>']]) + M.note('The decimal point moves ' + Math.abs(e) + ' place' + (Math.abs(e) > 1 ? 's' : '') + (e > 0 ? ' left, so the exponent is positive.' : ' right, so the exponent is negative.'))
            };
          }
          if (t === 2) {
            var s = std(m, e);
            return {
              prompt: 'Write as an ordinary number.', question: sci(m, e), answer: parseFloat(s.replace(/,/g, '')), display: s,
              solution: M.steps([[sci(m, e), '= <strong>' + s + '</strong>']]) + M.note('Move the decimal point ' + Math.abs(e) + ' place' + (Math.abs(e) > 1 ? 's' : '') + (e > 0 ? ' right.' : ' left.'))
            };
          }
          var a = M.rand(1, 4), b = M.rand(2, Math.floor(9 / a)), p = M.rand(-4, 8), q = M.rand(-4, 8);
          return {
            prompt: 'Multiply.', question: '(' + sci(a, p) + ')(' + sci(b, q) + ')', ask: '= ' + a * b + ' × ' + M.pow(10, '<span class="muted">?</span>'), answer: p + q, display: sci(a * b, p + q),
            solution: M.steps([['', '= (' + a + ' × ' + b + ') × ' + M.pow(10, n(p) + ' + ' + M.operand(q))], ['', '= <strong>' + sci(a * b, p + q) + '</strong>']]) + M.note('Multiply the numbers, add the exponents.')
          };
        }
      });
    })(IterMath);
  </script>
</body>
</html>
