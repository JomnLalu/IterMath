<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Circles practice · IterMath</title>
  <meta name="description" content="Find the circumference and area of a circle from its radius or diameter. Instant feedback and a worked solution for every miss.">
  <link rel="canonical" href="https://itermath.jomontolalu.com/circles">
  <meta name="theme-color" content="#fafafa">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="IterMath">
  <meta property="og:title" content="Circles practice · IterMath">
  <meta property="og:description" content="Find the circumference and area of a circle from its radius or diameter. Instant feedback and a worked solution for every miss.">
  <meta property="og:url" content="https://itermath.jomontolalu.com/circles">
  <meta property="og:image" content="https://itermath.jomontolalu.com/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="container container--narrow topbar">
    <a class="back" href="/" aria-label="All modules"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg><img src="/assets/itermath-logo.svg" alt="" width="104" height="37"></a>
  </header>

  <main class="container container--narrow">
    <div class="practice-header">
      <p class="eyebrow small muted">Geometry and measurement · Grades 7–8</p>
      <h1 class="h1">Circles</h1>
      <p class="lead">Find the circumference and area of a circle from its radius or diameter.</p>
    </div>

    <section class="card panel" aria-label="Exercise">
      <p id="question" class="question" aria-live="polite"></p>
      <form id="form" novalidate autocomplete="off">
        <label for="answer" class="visually-hidden">Your answer</label>
        <div class="answer-row">
          <input id="answer" class="input" type="text" inputmode="decimal" enterkeyhint="done" placeholder="Answer" aria-describedby="hint error">
          <button id="action" class="btn" type="submit">Check</button>
        </div>
        <p id="hint" class="field-hint small muted">Round to 1 decimal place. π or 3.14 both count.</p>
        <p id="error" class="field-error" role="alert" hidden></p>
      </form>
      <div id="feedback" class="feedback" aria-live="polite"></div>
    </section>
  </main>

  <script src="/assets/practice.js"></script>
  <script>
    (function (M) {
      M.practice({
        input: 'number',
        generate: function () {
          var u = M.pick(['cm', 'm', 'in']), r = M.rand(1, 15), useD = Math.random() < .4, t = M.rand(1, 5);
          var given = useD ? 'diameter of ' + 2 * r + ' ' + u : 'radius of ' + r + ' ' + u;
          var piQ = function (k, unit, what, rows) {
            var a = M.round(k * Math.PI, 1), b = M.round(k * 3.14, 1);
            return {
              prompt: 'A circle has a ' + given + '.', question: what, ask: '≈ <span class="muted">?</span> ' + unit,
              answer: a, sample: String(a), check: M.piCheck(k, 1),
              display: a + ' ' + unit + (a !== b ? ' (' + b + ' with π ≈ 3.14)' : ''),
              solution: M.steps(rows.concat([['', '≈ <strong>' + a + ' ' + unit + '</strong>']]))
            };
          };
          if (t <= 2) return piQ(2 * r, u, 'Circumference', useD ? [['<i>C</i>', '= π<i>d</i>'], ['', '= π × ' + 2 * r]] : [['<i>C</i>', '= 2π<i>r</i>'], ['', '= 2 × π × ' + r]]);
          if (t <= 4) return piQ(r * r, u + '<sup>2</sup>', 'Area', (useD ? [['<i>r</i>', '= ' + 2 * r + ' ÷ 2 = ' + r]] : []).concat([['<i>A</i>', '= π' + M.pow('<i>r</i>', 2)], ['', '= π × ' + r * r]]));
          if (Math.random() < .5) {
            return {
              prompt: 'A circle has a ' + given + '. Give the area in terms of π.', question: 'Area', ask: '= <span class="muted">?</span>π ' + u + '<sup>2</sup>',
              answer: r * r, display: r * r + 'π ' + u + '<sup>2</sup>', hint: 'Type the number in front of π.',
              solution: M.steps([['<i>A</i>', '= π' + M.pow('<i>r</i>', 2)], ['', '= π × ' + M.pow(r, 2) + ' = <strong>' + r * r + 'π ' + u + '<sup>2</sup></strong>']])
            };
          }
          return {
            prompt: 'A circle has a circumference of ' + 2 * r + 'π ' + u + '.', question: 'Radius', ask: '= <span class="muted">?</span> ' + u,
            answer: r, display: r + ' ' + u, hint: '',
            solution: M.steps([['2π<i>r</i>', '= ' + 2 * r + 'π'], ['<i>r</i>', '= ' + 2 * r + ' ÷ 2 = <strong>' + r + ' ' + u + '</strong>']])
          };
        }
      });
    })(IterMath);
  </script>
</body>
</html>
