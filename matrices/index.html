<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Matrices practice · IterMath</title>
  <meta name="description" content="Find 2 × 2 and 3 × 3 determinants and multiply 2 × 2 matrices. Instant feedback and a worked solution for every miss.">
  <link rel="canonical" href="https://itermath.jomontolalu.com/matrices">
  <meta name="theme-color" content="#fafafa">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="IterMath">
  <meta property="og:title" content="Matrices practice · IterMath">
  <meta property="og:description" content="Find 2 × 2 and 3 × 3 determinants and multiply 2 × 2 matrices. Instant feedback and a worked solution for every miss.">
  <meta property="og:url" content="https://itermath.jomontolalu.com/matrices">
  <meta property="og:image" content="https://itermath.jomontolalu.com/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="container container--narrow topbar">
    <a class="back" href="/" aria-label="All modules"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg><img src="/assets/itermath-logo.svg" alt="" width="104" height="37"></a>
  </header>

  <main class="container container--narrow">
    <div class="practice-header">
      <p class="eyebrow small muted">Advanced algebra and trigonometry · Grades 11–12</p>
      <h1 class="h1">Matrices</h1>
      <p class="lead">Find 2 × 2 and 3 × 3 determinants and multiply 2 × 2 matrices.</p>
    </div>

    <section class="card panel" aria-label="Exercise">
      <p id="question" class="question" aria-live="polite"></p>
      <form id="form" novalidate autocomplete="off">
        <label for="answer" class="visually-hidden">Your answer</label>
        <div class="answer-row">
          <input id="answer" class="input" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="Answer" aria-describedby="hint error">
          <button id="action" class="btn" type="submit">Check</button>
        </div>
        <p id="hint" class="field-hint small muted" hidden></p>
        <p id="error" class="field-error" role="alert" hidden></p>
      </form>
      <div id="feedback" class="feedback" aria-live="polite"></div>
    </section>
  </main>

  <script src="/assets/practice.js"></script>
  <script>
    (function (M) {
      M.practice({
        input: 'number',
        generate: function () {
          var n = M.num, o = M.operand, r = function (k) { return M.rand(-k, k); }, t = M.rand(1, 3);
          if (t === 1) {
            var a = r(9), b = r(9), c = r(9), d = r(9), ans = a * d - b * c;
            return {
              prompt: 'Find the determinant.', question: M.matrix([[a, b], [c, d]], true), answer: ans, hint: '',
              solution: M.steps([['', '= ' + o(a) + ' × ' + o(d) + ' − ' + o(b) + ' × ' + o(c)], ['', '= ' + n(a * d) + ' − ' + o(b * c)], ['', '= <strong>' + n(ans) + '</strong>']]) + M.note('For a 2 × 2 matrix: <i>ad</i> − <i>bc</i>.')
            };
          }
          if (t === 2) {
            var m = [[r(5), r(5), r(5)], [r(5), r(5), r(5)], [r(5), r(5), r(5)]];
            var minor = function (i, j) { return m[1][i] * m[2][j] - m[1][j] * m[2][i]; };
            var m1 = minor(1, 2), m2 = minor(0, 2), m3 = minor(0, 1), det = m[0][0] * m1 - m[0][1] * m2 + m[0][2] * m3;
            return {
              prompt: 'Find the determinant.', question: M.matrix(m, true), answer: det, hint: '',
              solution: M.steps([
                ['', '= ' + o(m[0][0]) + M.matrix([[m[1][1], m[1][2]], [m[2][1], m[2][2]]], true) + ' − ' + o(m[0][1]) + M.matrix([[m[1][0], m[1][2]], [m[2][0], m[2][2]]], true) + ' + ' + o(m[0][2]) + M.matrix([[m[1][0], m[1][1]], [m[2][0], m[2][1]]], true)],
                ['', '= ' + o(m[0][0]) + '(' + n(m1) + ') − ' + o(m[0][1]) + '(' + n(m2) + ') + ' + o(m[0][2]) + '(' + n(m3) + ')'],
                ['', '= <strong>' + n(det) + '</strong>']
              ]) + M.note('Expand along the top row, alternating signs + − +.')
            };
          }
          var A = [[r(6), r(6)], [r(6), r(6)]], B = [[r(6), r(6)], [r(6), r(6)]];
          var C = [[A[0][0] * B[0][0] + A[0][1] * B[1][0], A[0][0] * B[0][1] + A[0][1] * B[1][1]], [A[1][0] * B[0][0] + A[1][1] * B[1][0], A[1][0] * B[0][1] + A[1][1] * B[1][1]]];
          var cell = function (i, j) { return o(A[i][0]) + '·' + o(B[0][j]) + ' + ' + o(A[i][1]) + '·' + o(B[1][j]); };
          return {
            prompt: 'Multiply.', question: M.matrix(A) + M.matrix(B), answer: [C[0][0], C[0][1], C[1][0], C[1][1]], ordered: true,
            display: M.matrix(C), placeholder: 'a, b, c, d', hint: 'Enter the four entries row by row, separated by commas.',
            solution: M.steps([['top left', '= ' + cell(0, 0) + ' = ' + n(C[0][0])], ['top right', '= ' + cell(0, 1) + ' = ' + n(C[0][1])], ['bottom left', '= ' + cell(1, 0) + ' = ' + n(C[1][0])], ['bottom right', '= ' + cell(1, 1) + ' = ' + n(C[1][1])], ['', '= <strong>' + M.matrix(C) + '</strong>']]) +
              M.note('Each entry is a row of the first matrix times a column of the second.')
          };
        }
      });
    })(IterMath);
  </script>
</body>
</html>
