<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mixed operations practice · IterMath</title>
  <meta name="description" content="Expressions that combine all four operations. Answers can be negative. Instant feedback and a worked solution for every miss.">
  <link rel="canonical" href="https://itermath.jomontolalu.com/arithmetics">
  <meta name="theme-color" content="#fafafa">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="IterMath">
  <meta property="og:title" content="Mixed operations practice · IterMath">
  <meta property="og:description" content="Expressions that combine all four operations. Answers can be negative. Instant feedback and a worked solution for every miss.">
  <meta property="og:url" content="https://itermath.jomontolalu.com/arithmetics">
  <meta property="og:image" content="https://itermath.jomontolalu.com/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

</head>
<body>
  <header class="container container--narrow topbar">
    <a class="back" href="/" aria-label="All modules"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg><img src="/assets/itermath-logo.svg" alt="" width="104" height="37"></a>
  </header>

  <main class="container container--narrow">
    <div class="practice-header">
      <h1 class="h1">Mixed operations</h1>
      <p class="lead">Expressions that combine all four operations. Answers can be negative.</p>
    </div>

    <section class="card panel" aria-label="Exercise">
      <p id="question" class="question" aria-live="polite"></p>
      <form id="form" novalidate autocomplete="off">
        <label for="answer" class="visually-hidden">Your answer</label>
        <div class="answer-row">
          <input id="answer" class="input" type="number" step="1" enterkeyhint="done" placeholder="Answer" aria-describedby="error">
          <button id="action" class="btn" type="submit">Check</button>
        </div>
        <p id="error" class="field-error" role="alert" hidden></p>
      </form>
      <div id="feedback" class="feedback" aria-live="polite"></div>
    </section>
  </main>

  <script src="/assets/practice.js"></script>
  <script>
    (function (M) {
      M.practice({
        allowNegative: true,
        generate: function () {
    var s = M.sym, n = M.num, o = M.operand;
    function ap(a, op, b) { return op === '+' ? a + b : a - b; }
    var templates = [
      function () { // (a ± b) × c
        var a = M.rand(2, 15), b = M.rand(2, 15), c = M.rand(2, 9), op = M.pick(['+', '-']);
        var v = ap(a, op, b), ans = v * c;
        return { e: '(' + a + ' ' + s(op) + ' ' + b + ') × ' + c, ans: ans,
                 rows: ['= ' + o(v) + ' × ' + c] };
      },
      function () { // a × (b ± c)
        var a = M.rand(2, 9), b = M.rand(2, 15), c = M.rand(2, 15), op = M.pick(['+', '-']);
        var v = ap(b, op, c), ans = a * v;
        return { e: a + ' × (' + b + ' ' + s(op) + ' ' + c + ')', ans: ans,
                 rows: ['= ' + a + ' × ' + o(v)] };
      },
      function () { // (a ± b) ÷ c, divides cleanly
        var c = M.rand(2, 10), q = M.rand(2, 12), t = c * q, op = M.pick(['+', '-']), a, b;
        if (op === '+') { a = M.rand(1, t - 1); b = t - a; } else { b = M.rand(1, 20); a = t + b; }
        return { e: '(' + a + ' ' + s(op) + ' ' + b + ') ÷ ' + c, ans: q,
                 rows: ['= ' + t + ' ÷ ' + c] };
      },
      function () { // a ÷ b ± c × d
        var b = M.rand(2, 10), q = M.rand(2, 10), a = b * q, c = M.rand(2, 9), d = M.rand(2, 9), op = M.pick(['+', '-']);
        var p = c * d;
        return { e: a + ' ÷ ' + b + ' ' + s(op) + ' ' + c + ' × ' + d, ans: ap(q, op, p),
                 rows: ['= ' + q + ' ' + s(op) + ' ' + p] };
      },
      function () { // (a ± b) × (c ± d)
        var a = M.rand(1, 10), b = M.rand(1, 10), c = M.rand(1, 10), d = M.rand(1, 10);
        var op1 = M.pick(['+', '-']), op2 = M.pick(['+', '-']);
        var v1 = ap(a, op1, b), v2 = ap(c, op2, d);
        return { e: '(' + a + ' ' + s(op1) + ' ' + b + ') × (' + c + ' ' + s(op2) + ' ' + d + ')', ans: v1 * v2,
                 rows: ['= ' + o(v1) + ' × ' + o(v2)] };
      },
      function () { // a ± b × c ± d
        var a = M.rand(10, 30), b = M.rand(2, 9), c = M.rand(2, 9), d = M.rand(1, 20);
        var op1 = M.pick(['+', '-']), op2 = M.pick(['+', '-']);
        var m = b * c, v = ap(a, op1, m);
        return { e: a + ' ' + s(op1) + ' ' + b + ' × ' + c + ' ' + s(op2) + ' ' + d, ans: ap(v, op2, d),
                 rows: ['= ' + a + ' ' + s(op1) + ' ' + m + ' ' + s(op2) + ' ' + d, '= ' + n(v) + ' ' + s(op2) + ' ' + d] };
      }
    ];
    var t = M.pick(templates)();
    var rows = [[t.e, t.rows[0]]];
    for (var i = 1; i < t.rows.length; i++) rows.push(['', t.rows[i]]);
    rows.push(['', '= <strong>' + n(t.ans) + '</strong>']);
    return {
      question: t.e,
      answer: t.ans,
      solution: M.steps(rows) +
        '<p class="solution-note">Brackets first, then × and ÷ from left to right, then + and − from left to right.</p>'
    };
        }
      });
    })(IterMath);
  </script>
</body>
</html>
