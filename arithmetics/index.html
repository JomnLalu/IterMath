<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mixed Operations Practice | IterMath</title>
    <meta name="description" content="Practice multi-step expressions that test order of operations, with a PEMDAS reminder on every miss.">
    <link rel="canonical" href="https://itermath.jomontolalu.com/arithmetics/">
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="IterMath">
    <meta property="og:title" content="Mixed Operations Practice | IterMath">
    <meta property="og:description" content="Practice multi-step expressions that test order of operations, with a PEMDAS reminder on every miss.">
    <meta property="og:url" content="https://itermath.jomontolalu.com/arithmetics/">
    <meta property="og:image" content="https://itermath.jomontolalu.com/assets/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="/assets/style.css">
    <script>
        // Reveal questions only after MathJax has typeset them
        window.MathJax = {
            startup: {
                pageReady: () => MathJax.startup.defaultPageReady().then(() => document.documentElement.classList.add('math-ready'))
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" onerror="document.documentElement.classList.add('math-ready')"></script>
</head>
<body>

<main class="exercise">
    <a href="/" class="exercise-logo" aria-label="IterMath home">
        <img src="/assets/itermath-logo.svg" alt="IterMath" width="160" height="57">
    </a>

    <h1>Mixed Operations</h1>
    <div id="question-container" class="math-q"></div>
    
    <div class="input-group">
        <label for="answer-input" class="visually-hidden">Your answer</label>
        <input type="number" id="answer-input" class="input" placeholder="Answer" autocomplete="off" inputmode="numeric" />
        <button id="submit-btn" class="button" onclick="checkAnswer()">Submit</button>
    </div>
    
    <div id="feedback-container" class="feedback" aria-live="polite"></div>
    <button id="next-btn" class="button button-secondary" onclick="generateQuestion()" style="display:none;">Next Question</button>

    <a href="/" class="back-link">&larr; All modules</a>
</main>

<script>
    let currentTex, currentAns;

    // Utility functions to generate random numbers and operators
    function getRandOp(ops) { 
        return ops[Math.floor(Math.random() * ops.length)]; 
    }
    
    function getRandNum(min, max) { 
        return Math.floor(Math.random() * (max - min + 1)) + min; 
    }

    // This function creates randomized expressions while ensuring clean integer math
    function generateExpressionData() {
        const templates = [
            // 1. (A +/- B) * C
            () => {
                let a = getRandNum(2, 15), b = getRandNum(2, 15), c = getRandNum(2, 9);
                let op = getRandOp(['+', '-']);
                let tex = `(${a} ${op} ${b}) \\times ${c}`;
                let ans = op === '+' ? (a + b) * c : (a - b) * c;
                return { tex, ans };
            },
            // 2. A * (B +/- C)
            () => {
                let a = getRandNum(2, 9), b = getRandNum(2, 15), c = getRandNum(2, 15);
                let op = getRandOp(['+', '-']);
                let tex = `${a} \\times (${b} ${op} ${c})`;
                let ans = op === '+' ? a * (b + c) : a * (b - c);
                return { tex, ans };
            },
            // 3. (A +/- B) / C  [Ensures clean division]
            () => {
                let c = getRandNum(2, 10);
                let divResult = getRandNum(2, 12);
                let target = c * divResult; // Target is the total value inside parentheses
                let op = getRandOp(['+', '-']);
                let a, b;
                
                if (op === '+') {
                    a = getRandNum(1, target - 1);
                    b = target - a;
                } else {
                    b = getRandNum(1, 20);
                    a = target + b;
                }
                
                let tex = `(${a} ${op} ${b}) \\div ${c}`;
                return { tex, ans: divResult };
            },
            // 4. A / B +/- C * D [Ensures clean division]
            () => {
                let b = getRandNum(2, 10);
                let divResult = getRandNum(2, 10);
                let a = b * divResult;
                let c = getRandNum(2, 9), d = getRandNum(2, 9);
                let op = getRandOp(['+', '-']);
                let tex = `${a} \\div ${b} ${op} ${c} \\times ${d}`;
                let ans = op === '+' ? divResult + (c * d) : divResult - (c * d);
                return { tex, ans };
            },
            // 5. (A +/- B) * (C +/- D)
            () => {
                let a = getRandNum(1, 10), b = getRandNum(1, 10);
                let c = getRandNum(1, 10), d = getRandNum(1, 10);
                let op1 = getRandOp(['+', '-']), op2 = getRandOp(['+', '-']);
                let tex = `(${a} ${op1} ${b}) \\times (${c} ${op2} ${d})`;
                let val1 = op1 === '+' ? a + b : a - b;
                let val2 = op2 === '+' ? c + d : c - d;
                return { tex, ans: val1 * val2 };
            },
            // 6. A +/- B * C +/- D
            () => {
                let a = getRandNum(10, 30), b = getRandNum(2, 9), c = getRandNum(2, 9), d = getRandNum(1, 20);
                let op1 = getRandOp(['+', '-']), op2 = getRandOp(['+', '-']);
                let tex = `${a} ${op1} ${b} \\times ${c} ${op2} ${d}`;
                let valMult = b * c;
                let step1 = op1 === '+' ? a + valMult : a - valMult;
                let ans = op2 === '+' ? step1 + d : step1 - d;
                return { tex, ans };
            }
        ];

        // Randomly select one of the templates and generate the question
        let generator = templates[Math.floor(Math.random() * templates.length)];
        return generator();
    }

    // Initialize and generate the first question
    function generateQuestion() {
        document.getElementById('feedback-container').innerHTML = '';
        const input = document.getElementById('answer-input');
        input.value = '';
        input.disabled = false;
        document.getElementById('submit-btn').style.display = 'inline-block';
        document.getElementById('next-btn').style.display = 'none';
        
        input.focus();

        // Generate the new expression
        let mathData = generateExpressionData();
        currentTex = mathData.tex;
        currentAns = mathData.ans;

        // Display question using LaTeX notation
        const qHTML = `$$ ${currentTex} = \\text{?} $$`;
        document.getElementById('question-container').innerHTML = qHTML;
        
        // Re-render MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise();
        }
    }

    // Check user input against the calculated answer
    function checkAnswer() {
        const inputElement = document.getElementById('answer-input');
        const userAns = parseInt(inputElement.value);
        const feedback = document.getElementById('feedback-container');

        if (isNaN(userAns)) {
            feedback.innerHTML = `<p class="hint">Enter a number to check your answer.</p>`;
            inputElement.focus();
            return;
        }

        inputElement.disabled = true;
        document.getElementById('submit-btn').style.display = 'none';

        if (userAns === currentAns) {
            // Correct Sequence
            feedback.innerHTML = `
                <div class="correct">
                    Correct!
                    <span class="feedback-note">Loading next question...</span>
                </div>`;
            
            setTimeout(generateQuestion, 500);
            
        } else {
            // Incorrect Sequence (Displays Answer and Order of Operations logic)
            let steps = `<div class="incorrect-container">`;
            steps += `<p class="incorrect-title">Incorrect. The right answer is:</p>`;
            steps += `$$ ${currentTex} = \\mathbf{${currentAns}} $$`;
            
            steps += `<div class="note">`;
            steps += `<strong>Order of operations (PEMDAS)</strong><br>`;
            steps += `<strong>1.</strong> Parentheses <strong>( )</strong><br>`;
            steps += `<strong>2.</strong> Exponents<br>`;
            steps += `<strong>3.</strong> Multiplication <strong>&times;</strong> & Division <strong>&divide;</strong> (Left to Right)<br>`;
            steps += `<strong>4.</strong> Addition <strong>+</strong> & Subtraction <strong>&minus;</strong> (Left to Right)`;
            steps += `</div>`;
            steps += `</div>`;

            feedback.innerHTML = steps;
            
            document.getElementById('next-btn').style.display = 'inline-block';
            
            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise();
            }
        }
    }

    document.getElementById('answer-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            checkAnswer();
        }
    });

    window.onload = generateQuestion;
</script>

</body>
</html>
