<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Area and perimeter practice · IterMath</title>
  <meta name="description" content="Find the area and perimeter of rectangles, squares, triangles, parallelograms and trapezoids. Instant feedback and a worked solution for every miss.">
  <link rel="canonical" href="https://itermath.jomontolalu.com/area-perimeter">
  <meta name="theme-color" content="#fafafa">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="IterMath">
  <meta property="og:title" content="Area and perimeter practice · IterMath">
  <meta property="og:description" content="Find the area and perimeter of rectangles, squares, triangles, parallelograms and trapezoids. Instant feedback and a worked solution for every miss.">
  <meta property="og:url" content="https://itermath.jomontolalu.com/area-perimeter">
  <meta property="og:image" content="https://itermath.jomontolalu.com/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="container container--narrow topbar">
    <a class="back" href="/" aria-label="All modules"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg><img src="/assets/itermath-logo.svg" alt="" width="104" height="37"></a>
  </header>

  <main class="container container--narrow">
    <div class="practice-header">
      <p class="eyebrow small muted">Geometry and measurement · Grades 3–7</p>
      <h1 class="h1">Area and perimeter</h1>
      <p class="lead">Find the area and perimeter of rectangles, squares, triangles, parallelograms and trapezoids.</p>
    </div>

    <section class="card panel" aria-label="Exercise">
      <p id="question" class="question" aria-live="polite"></p>
      <form id="form" novalidate autocomplete="off">
        <label for="answer" class="visually-hidden">Your answer</label>
        <div class="answer-row">
          <input id="answer" class="input" type="text" inputmode="decimal" enterkeyhint="done" placeholder="Answer" aria-describedby="hint error">
          <button id="action" class="btn" type="submit">Check</button>
        </div>
        <p id="hint" class="field-hint small muted" hidden></p>
        <p id="error" class="field-error" role="alert" hidden></p>
      </form>
      <div id="feedback" class="feedback" aria-live="polite"></div>
    </section>
  </main>

  <script src="/assets/practice.js"></script>
  <script>
    (function (M) {
      M.practice({
        input: 'number',
        generate: function () {
          var u = M.pick(['cm', 'm', 'in', 'ft']), t = M.rand(1, 7), l = M.rand(2, 20), w = M.rand(2, 15), sq = '<sup>2</sup>';
          var ask = function (unit) { return '= <span class="muted">?</span> ' + unit; };
          if (t === 1) return { prompt: 'A rectangle is ' + l + ' ' + u + ' long and ' + w + ' ' + u + ' wide.', question: 'Area', ask: ask(u + sq), answer: l * w, display: l * w + ' ' + u + sq, solution: M.steps([['<i>A</i>', '= length × width'], ['', '= ' + l + ' × ' + w + ' = <strong>' + l * w + ' ' + u + sq + '</strong>']]) };
          if (t === 2) return { prompt: 'A rectangle is ' + l + ' ' + u + ' long and ' + w + ' ' + u + ' wide.', question: 'Perimeter', ask: ask(u), answer: 2 * (l + w), display: 2 * (l + w) + ' ' + u, solution: M.steps([['<i>P</i>', '= 2 × (length + width)'], ['', '= 2 × (' + l + ' + ' + w + ') = <strong>' + 2 * (l + w) + ' ' + u + '</strong>']]) };
          if (t === 3) {
            var s = M.rand(2, 15), area = Math.random() < .5;
            return { prompt: 'A square has sides of ' + s + ' ' + u + '.', question: area ? 'Area' : 'Perimeter', ask: ask(area ? u + sq : u), answer: area ? s * s : 4 * s, display: (area ? s * s + ' ' + u + sq : 4 * s + ' ' + u), solution: M.steps(area ? [['<i>A</i>', '= side × side'], ['', '= ' + s + ' × ' + s + ' = <strong>' + s * s + ' ' + u + sq + '</strong>']] : [['<i>P</i>', '= 4 × side'], ['', '= 4 × ' + s + ' = <strong>' + 4 * s + ' ' + u + '</strong>']]) };
          }
          if (t === 4) {
            var b = M.rand(2, 20), h = M.rand(2, 16);
            if ((b * h) % 2) h++;
            return { prompt: 'A triangle has base ' + b + ' ' + u + ' and height ' + h + ' ' + u + '.', question: 'Area', ask: ask(u + sq), answer: b * h / 2, display: b * h / 2 + ' ' + u + sq, solution: M.steps([['<i>A</i>', '= ' + M.frac(1, 2) + ' × base × height'], ['', '= ' + M.frac(1, 2) + ' × ' + b + ' × ' + h + ' = <strong>' + b * h / 2 + ' ' + u + sq + '</strong>']]) };
          }
          if (t === 5) return { prompt: 'A parallelogram has base ' + l + ' ' + u + ' and height ' + w + ' ' + u + '.', question: 'Area', ask: ask(u + sq), answer: l * w, display: l * w + ' ' + u + sq, solution: M.steps([['<i>A</i>', '= base × height'], ['', '= ' + l + ' × ' + w + ' = <strong>' + l * w + ' ' + u + sq + '</strong>']]) };
          if (t === 6) {
            var a = M.rand(3, 12), c = M.rand(a + 1, 20), hh = M.rand(2, 12);
            if (((a + c) * hh) % 2) hh++;
            var ar = (a + c) * hh / 2;
            return { prompt: 'A trapezoid has parallel sides ' + a + ' ' + u + ' and ' + c + ' ' + u + ', and height ' + hh + ' ' + u + '.', question: 'Area', ask: ask(u + sq), answer: ar, display: ar + ' ' + u + sq, solution: M.steps([['<i>A</i>', '= ' + M.frac(1, 2) + ' × (<i>a</i> + <i>b</i>) × <i>h</i>'], ['', '= ' + M.frac(1, 2) + ' × (' + a + ' + ' + c + ') × ' + hh + ' = <strong>' + ar + ' ' + u + sq + '</strong>']]) };
          }
          return { prompt: 'A rectangle has an area of ' + l * w + ' ' + u + sq + ' and a width of ' + w + ' ' + u + '.', question: 'Length', ask: ask(u), answer: l, display: l + ' ' + u, solution: M.steps([['length', '= area ÷ width'], ['', '= ' + l * w + ' ÷ ' + w + ' = <strong>' + l + ' ' + u + '</strong>']]) };
        }
      });
    })(IterMath);
  </script>
</body>
</html>
