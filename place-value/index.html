<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Place value practice · IterMath</title>
  <meta name="description" content="Find what a digit is worth, and build numbers from expanded form. Instant feedback and a worked solution for every miss.">
  <link rel="canonical" href="https://itermath.jomontolalu.com/place-value">
  <meta name="theme-color" content="#fafafa">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="IterMath">
  <meta property="og:title" content="Place value practice · IterMath">
  <meta property="og:description" content="Find what a digit is worth, and build numbers from expanded form. Instant feedback and a worked solution for every miss.">
  <meta property="og:url" content="https://itermath.jomontolalu.com/place-value">
  <meta property="og:image" content="https://itermath.jomontolalu.com/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="container container--narrow topbar">
    <a class="back" href="/" aria-label="All modules"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg><img src="/assets/itermath-logo.svg" alt="" width="104" height="37"></a>
  </header>

  <main class="container container--narrow">
    <div class="practice-header">
      <p class="eyebrow small muted">Number sense · Grades 1–4</p>
      <h1 class="h1">Place value</h1>
      <p class="lead">Find what a digit is worth, and build numbers from expanded form.</p>
    </div>

    <section class="card panel" aria-label="Exercise">
      <p id="question" class="question" aria-live="polite"></p>
      <form id="form" novalidate autocomplete="off">
        <label for="answer" class="visually-hidden">Your answer</label>
        <div class="answer-row">
          <input id="answer" class="input" type="text" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done" placeholder="Answer" aria-describedby="hint error">
          <button id="action" class="btn" type="submit">Check</button>
        </div>
        <p id="hint" class="field-hint small muted" hidden></p>
        <p id="error" class="field-error" role="alert" hidden></p>
      </form>
      <div id="feedback" class="feedback" aria-live="polite"></div>
    </section>
  </main>

  <script src="/assets/practice.js"></script>
  <script>
    (function (M) {
      M.practice({
        input: 'number',
        generate: function () {
          var names = ['ones', 'tens', 'hundreds', 'thousands', 'ten thousands', 'hundred thousands'];
          var len = M.rand(3, 6), digits = [M.rand(1, 9)];
          for (var i = 1; i < len; i++) digits.push(M.rand(0, 9));
          var value = parseInt(digits.join(''), 10);
          var fmt = function (x) { return x.toLocaleString('en-US'); };

          if (Math.random() < .35) {
            var parts = [], words = [];
            digits.forEach(function (d, k) {
              var place = len - 1 - k;
              if (d) parts.push(fmt(d * Math.pow(10, place)));
              words.push(d + ' ' + names[place]);
            });
            return {
              prompt: 'Write the number.',
              question: parts.join(' + '),
              answer: value,
              display: fmt(value),
              solution: M.steps([[parts.join(' + '), '= <strong>' + fmt(value) + '</strong>']]) +
                M.note('Put each digit in its place: ' + words.join(', ') + '.')
            };
          }

          var pos;
          do { pos = M.rand(0, len - 1); } while (!digits[pos]);
          var place = len - 1 - pos, unit = Math.pow(10, place), ans = digits[pos] * unit, shown = '';
          digits.forEach(function (d, k) {
            var fromRight = len - 1 - k;
            shown += k === pos ? '<u>' + d + '</u>' : d;
            if (fromRight > 0 && fromRight % 3 === 0) shown += ',';
          });
          return {
            prompt: 'What is the underlined digit worth?',
            question: shown,
            ask: false,
            answer: ans,
            display: fmt(ans),
            solution: M.steps([
              [String(digits[pos]), 'is in the ' + names[place] + ' place'],
              ['', '= ' + digits[pos] + ' × ' + fmt(unit)],
              ['', '= <strong>' + fmt(ans) + '</strong>']
            ])
          };
        }
      });
    })(IterMath);
  </script>
</body>
</html>
