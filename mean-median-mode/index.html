  <header class="container container--narrow topbar">
    <a class="back" href="/" aria-label="All modules"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg><img src="/assets/itermath-logo.svg" alt="" width="104" height="37"></a>
  </header>

  <main class="container container--narrow">
    <div class="practice-header">
      <p class="eyebrow small muted">Statistics and probability · Grades 6–7</p>
      <h1 class="h1">Mean, median, mode and range</h1>
      <p class="lead">Find the mean, median, mode and range of a small data set.</p>
    </div>

    <section class="card panel" aria-label="Exercise">
      <p id="question" class="question" aria-live="polite"></p>
      <form id="form" novalidate autocomplete="off">
        <label for="answer" class="visually-hidden">Your answer</label>
        <div class="answer-row">
          <input id="answer" class="input" type="text" inputmode="decimal" enterkeyhint="done" placeholder="Answer" aria-describedby="hint error">
          <button id="action" class="btn" type="submit">Check</button>
        </div>
        <p id="hint" class="field-hint small muted" hidden></p>
        <p id="error" class="field-error" role="alert" hidden></p>
      </form>
      <div id="feedback" class="feedback" aria-live="polite"></div>
    </section>
  </main>

  <script src="/assets/practice.js"></script>
  <script>
    (function (M) {
      M.practice({
        input: 'number',
        generate: function () {
          var n = M.num, kind = M.pick(['mean', 'mean', 'median', 'mode', 'range']), cnt = M.rand(5, 8), list, i;
          function make() { var l = []; for (var j = 0; j < cnt; j++) l.push(M.rand(1, 30)); return l; }
          if (kind === 'mean') {
            do { list = make(); } while (list.reduce(function (a, b) { return a + b; }, 0) % cnt);
          } else if (kind === 'mode') {
            do {
              list = make(); list[1] = list[0]; if (Math.random() < .5) list[2] = list[0];
              var counts = {}; list.forEach(function (x) { counts[x] = (counts[x] || 0) + 1; });
              var max = Math.max.apply(null, Object.keys(counts).map(function (k) { return counts[k]; }));
              var modes = Object.keys(counts).filter(function (k) { return counts[k] === max; });
            } while (modes.length !== 1);
          } else list = make();
          list = M.shuffle(list);
          var sorted = list.slice().sort(function (a, b) { return a - b; }), sum = list.reduce(function (a, b) { return a + b; }, 0), ans, rows;
          if (kind === 'mean') { ans = sum / cnt; rows = [['sum', '= ' + list.join(' + ') + ' = ' + sum], ['mean', '= ' + sum + ' ÷ ' + cnt + ' = <strong>' + n(ans) + '</strong>']]; }
          if (kind === 'median') {
            var mid = Math.floor(cnt / 2);
            ans = cnt % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
            rows = [['in order', sorted.join(', ')], ['median', cnt % 2 ? '= the middle value = <strong>' + ans + '</strong>' : '= (' + sorted[mid - 1] + ' + ' + sorted[mid] + ') ÷ 2 = <strong>' + n(ans) + '</strong>']];
          }
          if (kind === 'mode') {
            var c = {}; list.forEach(function (x) { c[x] = (c[x] || 0) + 1; });
            ans = sorted.reduce(function (best, x) { return c[x] > c[best] ? x : best; }, sorted[0]);
            rows = [['in order', sorted.join(', ')], ['mode', '= <strong>' + ans + '</strong> (appears ' + c[ans] + ' times)']];
          }
          if (kind === 'range') { ans = sorted[cnt - 1] - sorted[0]; rows = [['range', '= largest − smallest'], ['', '= ' + sorted[cnt - 1] + ' − ' + sorted[0] + ' = <strong>' + ans + '</strong>']]; }
          return { prompt: 'Find the ' + kind + '.', question: list.join(', '), ask: false, answer: ans, solution: M.steps(rows) };
        }
      });
    })(IterMath);
  </script>
</body>
