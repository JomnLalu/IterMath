<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>One-step equations practice · IterMath</title>
  <meta name="description" content="Solve equations that take one inverse operation. Instant feedback and a worked solution for every miss.">
  <link rel="canonical" href="https://itermath.jomontolalu.com/one-step-equations">
  <meta name="theme-color" content="#fafafa">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="IterMath">
  <meta property="og:title" content="One-step equations practice · IterMath">
  <meta property="og:description" content="Solve equations that take one inverse operation. Instant feedback and a worked solution for every miss.">
  <meta property="og:url" content="https://itermath.jomontolalu.com/one-step-equations">
  <meta property="og:image" content="https://itermath.jomontolalu.com/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="container container--narrow topbar">
    <a class="back" href="/" aria-label="All modules"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg><img src="/assets/itermath-logo.svg" alt="" width="104" height="37"></a>
  </header>

  <main class="container container--narrow">
    <div class="practice-header">
      <p class="eyebrow small muted">Algebra · Grades 6–7</p>
      <h1 class="h1">One-step equations</h1>
      <p class="lead">Solve equations that take one inverse operation.</p>
    </div>

    <section class="card panel" aria-label="Exercise">
      <p id="question" class="question" aria-live="polite"></p>
      <form id="form" novalidate autocomplete="off">
        <label for="answer" class="visually-hidden">Your answer</label>
        <div class="answer-row">
          <input id="answer" class="input" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="x =" aria-describedby="hint error">
          <button id="action" class="btn" type="submit">Check</button>
        </div>
        <p id="hint" class="field-hint small muted" hidden></p>
        <p id="error" class="field-error" role="alert" hidden></p>
      </form>
      <div id="feedback" class="feedback" aria-live="polite"></div>
    </section>
  </main>

  <script src="/assets/practice.js"></script>
  <script>
    (function (M) {
      M.practice({
        input: 'number',
        generate: function () {
          var n = M.num, o = M.operand, x = M.v('x'), xs = M.randNZ(-12, 15), a = M.rand(2, 15), t = M.rand(1, 4), eq, rows;
          if (t === 1) { var b = xs + a; eq = x + ' + ' + a + ' = ' + n(b); rows = [[x + ' + ' + a + ' − ' + a, '= ' + n(b) + ' − ' + a], [x, '= <strong>' + n(xs) + '</strong>']]; }
          else if (t === 2) { var c = xs - a; eq = x + ' − ' + a + ' = ' + n(c); rows = [[x + ' − ' + a + ' + ' + a, '= ' + n(c) + ' + ' + a], [x, '= <strong>' + n(xs) + '</strong>']]; }
          else if (t === 3) { a = M.randNZ(-9, 9); if (Math.abs(a) === 1) a = 7; var p = a * xs; eq = M.terms([[a, x]]) + ' = ' + n(p); rows = [[M.frac(M.terms([[a, x]]), o(a)), '= ' + M.frac(n(p), o(a))], [x, '= <strong>' + n(xs) + '</strong>']]; }
          else { a = M.rand(2, 9); var k = M.randNZ(-9, 9); xs = a * k; eq = M.frac(x, a) + ' = ' + n(k); rows = [[M.frac(x, a) + ' × ' + a, '= ' + n(k) + ' × ' + a], [x, '= <strong>' + n(xs) + '</strong>']]; }
          return { prompt: 'Solve for ' + x + '.', question: eq, ask: false, answer: xs, solution: M.steps(rows) + M.note('Do the opposite operation to both sides.') };
        }
      });
    })(IterMath);
  </script>
</body>
</html>
