<body>
  <header class="container container--narrow topbar">
    <a class="back" href="/" aria-label="All modules"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg><img src="/assets/itermath-logo.svg" alt="" width="104" height="37"></a>
  </header>

  <main class="container container--narrow">
    <div class="practice-header">
      <p class="eyebrow small muted">Fractions and decimals · Grades 6–7</p>
      <h1 class="h1">Fractions, decimals and percents</h1>
      <p class="lead">Convert between fractions, decimals and percents.</p>
    </div>

    <section class="card panel" aria-label="Exercise">
      <p id="question" class="question" aria-live="polite"></p>
      <form id="form" novalidate autocomplete="off">
        <label for="answer" class="visually-hidden">Your answer</label>
        <div class="answer-row">
          <input id="answer" class="input" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="Answer" aria-describedby="hint error">
          <button id="action" class="btn" type="submit">Check</button>
        </div>
        <p id="hint" class="field-hint small muted" hidden></p>
        <p id="error" class="field-error" role="alert" hidden></p>
      </form>
      <div id="feedback" class="feedback" aria-live="polite"></div>
    </section>
  </main>

  <script src="/assets/practice.js"></script>
  <script>
    (function (M) {
      M.practice({
        input: 'number',
        generate: function () {
          var n = M.num, dens = [2, 4, 5, 8, 10, 20, 25, 50], d = M.pick(dens), x, t = M.rand(1, 5);
          do { x = M.rand(1, d - 1); } while (M.gcd(x, d) !== 1);
          var dec = x / d;
          if (t === 1) {
            return {
              prompt: 'Write as a decimal.', question: M.frac(x, d), answer: dec, form: 'decimal', hint: '',
              solution: M.steps([[M.frac(x, d), '= ' + x + ' ÷ ' + d], ['', '= <strong>' + n(dec) + '</strong>']])
            };
          }
          if (t === 2) {
            var places = String(n(dec)).split('.')[1].length, p10 = Math.pow(10, places), top = Math.round(dec * p10);
            return {
              prompt: 'Write as a fraction in simplest form.', question: n(dec), answer: M.Q(x, d), form: 'fraction', hint: 'Type a fraction like 3/4.',
              solution: M.steps([[n(dec), '= ' + M.frac(top, p10)], ['', '= <strong>' + M.frac(x, d) + '</strong>']])
            };
          }
          if (t === 3) {
            var p = M.pick([M.rand(1, 99), M.rand(1, 99), M.rand(101, 250), M.rand(1, 40) + .5]);
            return {
              prompt: 'Write as a decimal.', question: n(p) + '%', answer: p / 100, hint: '',
              solution: M.steps([[n(p) + '%', '= ' + n(p) + ' ÷ 100'], ['', '= <strong>' + n(p / 100) + '</strong>']])
            };
          }
          if (t === 4) {
            var pi = M.rand(1, 250), v = pi / 100;
            return {
              prompt: 'Write as a percent.', question: n(v), ask: '= <span class="muted">?</span>%', answer: pi, display: pi + '%', hint: '',
              solution: M.steps([[n(v), '= ' + n(v) + ' × 100%'], ['', '= <strong>' + pi + '%</strong>']])
            };
          }
          var d2 = M.pick([2, 4, 5, 10, 20, 25, 50]), x2;
          do { x2 = M.rand(1, d2 - 1); } while (M.gcd(x2, d2) !== 1);
          var pc = x2 * 100 / d2;
          return {
            prompt: 'Write as a percent.', question: M.frac(x2, d2), ask: '= <span class="muted">?</span>%', answer: pc, display: pc + '%', hint: '',
            solution: M.steps([[M.frac(x2, d2), '= ' + M.frac(x2 + ' × ' + (100 / d2), d2 + ' × ' + (100 / d2))], ['', '= ' + M.frac(pc, 100)], ['', '= <strong>' + pc + '%</strong>']])
          };
        }
      });
    })(IterMath);
  </script>
</body>
</html>
