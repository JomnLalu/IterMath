  <meta name="description" content="Multiply and divide decimals by whole numbers and by other decimals. Instant feedback and a worked solution for every miss.">

  <meta property="og:site_name" content="IterMath">
  <meta property="og:title" content="Multiplying and dividing decimals practice · IterMath">
  <meta property="og:description" content="Multiply and divide decimals by whole numbers and by other decimals. Instant feedback and a worked solution for every miss.">

<body>
  <header class="container container--narrow topbar">
    <a class="back" href="../../" aria-label="All modules"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg><img src="../../assets/itermath-logo.svg" alt="" width="104" height="37"></a>
  </header>

  <main class="container container--narrow">
    <div class="practice-header">
      <p class="eyebrow small muted">Fractions and decimals · Grades 5–6</p>
      <h1 class="h1">Multiplying and dividing decimals</h1>
      <p class="lead">Multiply and divide decimals by whole numbers and by other decimals.</p>
    </div>

    <section class="card panel" aria-label="Exercise">
      <p id="question" class="question" aria-live="polite"></p>
      <form id="form" novalidate autocomplete="off">
        <label for="answer" class="visually-hidden">Your answer</label>
        <div class="answer-row">
          <input id="answer" class="input" type="text" inputmode="decimal" enterkeyhint="done" placeholder="Answer" aria-describedby="hint error">
          <button id="action" class="btn" type="submit">Check</button>
        </div>
        <p id="hint" class="field-hint small muted" hidden></p>
        <p id="error" class="field-error" role="alert" hidden></p>
      </form>
      <div id="feedback" class="feedback" aria-live="polite"></div>
    </section>
  </main>

  <script src="../../assets/practice.js"></script>
  <script>
    (function (M) {
      M.practice({
        input: 'number',
        generate: function () {
          var n = M.num, t = M.rand(1, 4), k1, k2, ai, bi, ans, q, rows;
          function nz(lo, hi) { var x; do { x = M.rand(lo, hi); } while (x % 10 === 0); return x; }
          if (t === 1) {
            k1 = M.rand(1, 2); ai = nz(11, 999); bi = M.rand(2, 12);
            ans = ai * bi / Math.pow(10, k1);
            q = n(ai / Math.pow(10, k1)) + ' × ' + bi;
            rows = [[ai + ' × ' + bi, '= ' + ai * bi], [q, '= <strong>' + n(ans) + '</strong>']];
            return { question: q, answer: ans, solution: M.steps(rows) + M.note('Multiply as whole numbers, then put back ' + k1 + ' decimal place' + (k1 > 1 ? 's' : '') + '.') };
          }
          if (t === 2) {
            k1 = 1; k2 = M.rand(1, 2); ai = nz(2, 99); bi = nz(2, 99);
            ans = ai * bi / Math.pow(10, k1 + k2);
            q = n(ai / 10) + ' × ' + n(bi / Math.pow(10, k2));
            rows = [[ai + ' × ' + bi, '= ' + ai * bi], [q, '= <strong>' + n(ans) + '</strong>']];
            return { question: q, answer: ans, solution: M.steps(rows) + M.note('Multiply as whole numbers. The factors have ' + (k1 + k2) + ' decimal places in total, so the answer does too.') };
          }
          if (t === 3) {
            k1 = M.rand(1, 2); var qi = nz(11, 999); bi = M.rand(2, 9); ai = qi * bi;
            ans = qi / Math.pow(10, k1);
            q = n(ai / Math.pow(10, k1)) + ' ÷ ' + bi;
            rows = [[ai + ' ÷ ' + bi, '= ' + qi], [q, '= <strong>' + n(ans) + '</strong>']];
            return { question: q, answer: ans, solution: M.steps(rows) + M.note('Divide as whole numbers, keeping the decimal point in the same place.') };
          }
          bi = nz(2, 9); var qq = M.rand(2, 40); ai = bi * qq;
          var A = ai / 10, B = bi / 10;
          if (Math.random() < .5) { A = ai / 100; B = bi / 100; }
          q = n(A) + ' ÷ ' + n(B);
          var scale = B === bi / 10 ? 10 : 100;
          rows = [[q, '= ' + n(A * scale) + ' ÷ ' + n(B * scale)], ['', '= <strong>' + qq + '</strong>']];
          return { question: q, answer: qq, solution: M.steps(rows) + M.note('Multiply both numbers by ' + scale + ' so you divide by a whole number.') };
        }
      });
    })(IterMath);
  </script>
</body>
</html>
