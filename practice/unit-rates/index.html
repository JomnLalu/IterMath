<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Unit rates and speed practice · IterMath</title>
  <meta name="description" content="Find the price of one item, and work with speed, distance and time. Instant feedback and a worked solution for every miss.">
  <link rel="canonical" href="https://itermath.jomontolalu.com/practice/unit-rates/">
  <meta name="theme-color" content="#fafafa">
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="IterMath">
  <meta property="og:title" content="Unit rates and speed practice · IterMath">
  <meta property="og:description" content="Find the price of one item, and work with speed, distance and time. Instant feedback and a worked solution for every miss.">
  <meta property="og:url" content="https://itermath.jomontolalu.com/practice/unit-rates/">
  <meta property="og:image" content="https://itermath.jomontolalu.com/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
  <header class="container container--narrow topbar">
    <a class="back" href="../../" aria-label="All modules"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg><img src="../../assets/itermath-logo.svg" alt="" width="104" height="37"></a>
  </header>

  <main class="container container--narrow">
    <div class="practice-header">
      <p class="eyebrow small muted">Ratios and percents · Grades 6–7</p>
      <h1 class="h1">Unit rates and speed</h1>
      <p class="lead">Find the price of one item, and work with speed, distance and time.</p>
    </div>

    <section class="card panel" aria-label="Exercise">
      <p id="question" class="question" aria-live="polite"></p>
      <form id="form" novalidate autocomplete="off">
        <label for="answer" class="visually-hidden">Your answer</label>
        <div class="answer-row">
          <input id="answer" class="input" type="text" inputmode="decimal" enterkeyhint="done" placeholder="Answer" aria-describedby="hint error">
          <button id="action" class="btn" type="submit">Check</button>
        </div>
        <p id="hint" class="field-hint small muted" hidden></p>
        <p id="error" class="field-error" role="alert" hidden></p>
      </form>
      <div id="feedback" class="feedback" aria-live="polite"></div>
    </section>
  </main>

  <script src="../../assets/practice.js"></script>
  <script>
    (function (M) {
      M.practice({
        input: 'number',
        generate: function () {
          var n = M.num, t = M.rand(1, 5);
          var money = function (x) { return '$' + x.toFixed(2); };
          if (t === 1) {
            var items = M.pick(['notebooks', 'apples', 'pens', 'tickets', 'muffins']), c = M.rand(2, 12), u = M.rand(5, 200) * 5;
            var single = items.replace(/s$/, '');
            return {
              prompt: c + ' ' + items + ' cost ' + money(c * u / 100) + '.', question: '1 ' + single, ask: '= $<span class="muted">?</span>',
              answer: u / 100, display: money(u / 100),
              solution: M.steps([['1 ' + single, '= ' + money(c * u / 100) + ' ÷ ' + c], ['', '= <strong>' + money(u / 100) + '</strong>']])
            };
          }
          var s = M.rand(3, 18) * 5, h = M.rand(2, 8);
          if (t === 2) {
            return {
              prompt: 'A car travels ' + s * h + ' km in ' + h + ' hours.', question: 'Speed', ask: '= <span class="muted">?</span> km/h', answer: s, display: s + ' km/h',
              solution: M.steps([['speed', '= distance ÷ time'], ['', '= ' + s * h + ' ÷ ' + h], ['', '= <strong>' + s + ' km/h</strong>']])
            };
          }
          if (t === 3) {
            return {
              prompt: 'A train goes ' + s + ' km/h for ' + h + ' hours.', question: 'Distance', ask: '= <span class="muted">?</span> km', answer: s * h, display: s * h + ' km',
              solution: M.steps([['distance', '= speed × time'], ['', '= ' + s + ' × ' + h], ['', '= <strong>' + s * h + ' km</strong>']])
            };
          }
          if (t === 4) {
            return {
              prompt: 'A cyclist rides ' + s * h + ' km at ' + s + ' km/h.', question: 'Time', ask: '= <span class="muted">?</span> hours', answer: h, display: h + ' hours',
              solution: M.steps([['time', '= distance ÷ speed'], ['', '= ' + s * h + ' ÷ ' + s], ['', '= <strong>' + h + ' hours</strong>']])
            };
          }
          var rate = M.rand(15, 90), mins = M.rand(2, 12), task = M.pick([['types', 'words'], ['reads', 'pages'], ['packs', 'boxes']]);
          return {
            prompt: 'Sam ' + task[0] + ' ' + rate * mins + ' ' + task[1] + ' in ' + mins + ' minutes.', question: task[1].charAt(0).toUpperCase() + task[1].slice(1) + ' per minute',
            answer: rate,
            solution: M.steps([['rate', '= ' + rate * mins + ' ÷ ' + mins], ['', '= <strong>' + rate + '</strong> ' + task[1] + ' per minute']])
          };
        }
      });
    })(IterMath);
  </script>
</body>
</html>
