<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Division with remainders practice · IterMath</title>
  <meta name="description" content="Divide and give the quotient and the remainder, like 7 R 3. Instant feedback and a worked solution for every miss.">
  <link rel="canonical" href="https://itermath.jomontolalu.com/practice/remainders/">
  <meta name="theme-color" content="#fafafa">
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="IterMath">
  <meta property="og:title" content="Division with remainders practice · IterMath">
  <meta property="og:description" content="Divide and give the quotient and the remainder, like 7 R 3. Instant feedback and a worked solution for every miss.">
  <meta property="og:url" content="https://itermath.jomontolalu.com/practice/remainders/">
  <meta property="og:image" content="https://itermath.jomontolalu.com/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
  <header class="container container--narrow topbar">
    <a class="back" href="../../" aria-label="All modules"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg><img src="../../assets/itermath-logo.svg" alt="" width="104" height="37"></a>
  </header>

  <main class="container container--narrow">
    <div class="practice-header">
      <p class="eyebrow small muted">Arithmetic · Grades 3–5</p>
      <h1 class="h1">Division with remainders</h1>
      <p class="lead">Divide and give the quotient and the remainder, like 7 R 3.</p>
    </div>

    <section class="card panel" aria-label="Exercise">
      <p id="question" class="question" aria-live="polite"></p>
      <form id="form" novalidate autocomplete="off">
        <label for="answer" class="visually-hidden">Your answer</label>
        <div class="answer-row">
          <input id="answer" class="input" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="7 R 3" aria-describedby="hint error">
          <button id="action" class="btn" type="submit">Check</button>
        </div>
        <p id="hint" class="field-hint small muted">Type the quotient, then R, then the remainder.</p>
        <p id="error" class="field-error" role="alert" hidden></p>
      </form>
      <div id="feedback" class="feedback" aria-live="polite"></div>
    </section>
  </main>

  <script src="../../assets/practice.js"></script>
  <script>
    (function (M) {
      M.practice({
        input: 'number',
        generate: function () {
          var b = M.rand(2, 12), q = M.rand(2, 15), r = M.rand(1, b - 1), a = b * q + r;
          return {
            question: a + ' ÷ ' + b,
            answer: q + ' R ' + r,
            sample: q + ' R ' + r,
            check: function (raw) {
              var s = raw.trim();
              if (/^\d+$/.test(s)) return 'Include the remainder, like 7 R 3.';
              var m = /^(\d+)\s*(?:r|rem|remainder|,|\s)\s*(\d+)$/i.exec(s);
              if (!m) return 'Type it like 7 R 3.';
              return parseInt(m[1], 10) === q && parseInt(m[2], 10) === r;
            },
            display: q + ' R ' + r,
            solution: M.steps([
              [b + ' × ' + q, '= ' + b * q + ' (the most ' + b + 's that fit in ' + a + ')'],
              [a + ' − ' + b * q, '= ' + r],
              [a + ' ÷ ' + b, '= <strong>' + q + ' R ' + r + '</strong>']
            ]) + M.note('The remainder must be less than ' + b + '.')
          };
        }
      });
    })(IterMath);
  </script>
</body>
</html>
