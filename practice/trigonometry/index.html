<html lang="en">

  <meta name="description" content="Use sine, cosine and tangent (SOH CAH TOA) to find missing sides and angles. Instant feedback and a worked solution for every miss.">

<body>
  <header class="container container--narrow topbar">
    <a class="back" href="../../" aria-label="All modules"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg><img src="../../assets/itermath-logo.svg" alt="" width="104" height="37"></a>
  </header>

  <main class="container container--narrow">
    <div class="practice-header">
      <p class="eyebrow small muted">Advanced algebra and trigonometry · Grades 9–11</p>
      <h1 class="h1">Right-triangle trigonometry</h1>
      <p class="lead">Use sine, cosine and tangent (SOH CAH TOA) to find missing sides and angles.</p>
    </div>

    <section class="card panel" aria-label="Exercise">
      <p id="question" class="question" aria-live="polite"></p>
      <form id="form" novalidate autocomplete="off">
        <label for="answer" class="visually-hidden">Your answer</label>
        <div class="answer-row">
          <input id="answer" class="input" type="text" inputmode="decimal" enterkeyhint="done" placeholder="Answer" aria-describedby="hint error">
          <button id="action" class="btn" type="submit">Check</button>
        </div>
        <p id="hint" class="field-hint small muted" hidden></p>
        <p id="error" class="field-error" role="alert" hidden></p>
      </form>
      <div id="feedback" class="feedback" aria-live="polite"></div>
    </section>
  </main>

  <script src="../../assets/practice.js"></script>
  <script>
    (function (M) {
      M.practice({
        input: 'number',
        generate: function () {
          var rad = Math.PI / 180, x = '<tspan font-style="italic">x</tspan>', t = M.rand(1, 4);
          if (t <= 3) {
            var th = M.rand(15, 75), s = M.rand(4, 25), lab = th + '°', known, want, val, fn, rows;
            var opp = Math.sin(th * rad), adj = Math.cos(th * rad);
            var kind = M.pick([['hyp', 'opp'], ['hyp', 'adj'], ['adj', 'opp'], ['adj', 'hyp'], ['opp', 'adj'], ['opp', 'hyp']]);
            known = kind[0]; want = kind[1];
            var len = { hyp: 1, opp: opp, adj: adj }, scale = s / len[known];
            val = M.round(len[want] * scale, 1);
            var labels = { angle: lab }; labels[known] = s; labels[want] = x;
            var pair = known + want, ratio;
            if (/opp/.test(pair) && /hyp/.test(pair)) { fn = 'sin'; ratio = 'opposite / hypotenuse'; }
            else if (/adj/.test(pair) && /hyp/.test(pair)) { fn = 'cos'; ratio = 'adjacent / hypotenuse'; }
            else { fn = 'tan'; ratio = 'opposite / adjacent'; }
            var ratioParts = { sin: ['opp', 'hyp'], cos: ['adj', 'hyp'], tan: ['opp', 'adj'] }[fn];
            var num = ratioParts[0] === want ? '<i>x</i>' : s, den = ratioParts[1] === want ? '<i>x</i>' : s;
            rows = [[fn + ' ' + lab, '= ' + M.frac(num, den)], ['<i>x</i>', '= ' + (num === '<i>x</i>' ? s + ' × ' + fn + ' ' + lab : M.frac(s, fn + ' ' + lab))], ['', '≈ <strong>' + val.toFixed(1) + '</strong>']];
            return {
              question: M.triangle(labels) + '<i>x</i>', ask: '≈ <span class="muted">?</span>', answer: val, places: 1, display: val.toFixed(1), hint: 'Round to 1 decimal place.',
              solution: M.steps(rows) + M.note(fn.charAt(0).toUpperCase() + fn.slice(1) + ' = ' + ratio + '. Make sure your calculator is in degrees.')
            };
          }
          var o = M.rand(2, 15), a = M.rand(2, 15), h = M.rand(Math.max(o, a) + 1, 25), which = M.rand(1, 3), lbl = { angle: 'θ' }, ang, r2;
          if (which === 1) { lbl.opp = o; lbl.hyp = h; ang = Math.asin(o / h) / rad; r2 = [['sin θ', '= ' + M.frac(o, h)], ['θ', '= ' + M.pow('sin', '−1') + '(' + M.frac(o, h) + ')']]; }
          else if (which === 2) { lbl.adj = a; lbl.hyp = h; ang = Math.acos(a / h) / rad; r2 = [['cos θ', '= ' + M.frac(a, h)], ['θ', '= ' + M.pow('cos', '−1') + '(' + M.frac(a, h) + ')']]; }
          else { lbl.opp = o; lbl.adj = a; ang = Math.atan(o / a) / rad; r2 = [['tan θ', '= ' + M.frac(o, a)], ['θ', '= ' + M.pow('tan', '−1') + '(' + M.frac(o, a) + ')']]; }
          var deg = M.round(ang, 0);
          return {
            question: M.triangle(lbl) + 'θ', ask: '≈ <span class="muted">?</span>°', answer: deg, places: 0, display: deg + '°', hint: 'Round to the nearest degree.',
            solution: M.steps(r2.concat([['', '≈ <strong>' + deg + '°</strong>']])) + M.note('Use the inverse function to turn a ratio back into an angle.')
          };
        }
      });
    })(IterMath);
  </script>
</body>
</html>
