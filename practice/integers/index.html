<html lang="en">
<head>

  <meta name="description" content="Add, subtract, multiply and divide negative numbers, and work with absolute value. Instant feedback and a worked solution for every miss.">
  <link rel="canonical" href="https://itermath.jomontolalu.com/practice/integers/">

  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="IterMath">
  <meta property="og:title" content="Integers practice · IterMath">
  <meta property="og:description" content="Add, subtract, multiply and divide negative numbers, and work with absolute value. Instant feedback and a worked solution for every miss.">
  <meta property="og:url" content="https://itermath.jomontolalu.com/practice/integers/">

</head>
<body>
  <header class="container container--narrow topbar">
    <a class="back" href="../../" aria-label="All modules"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg><img src="../../assets/itermath-logo.svg" alt="" width="104" height="37"></a>
  </header>

  <main class="container container--narrow">
    <div class="practice-header">
      <p class="eyebrow small muted">Integers, powers and factors · Grades 6–7</p>
      <h1 class="h1">Integers</h1>
      <p class="lead">Add, subtract, multiply and divide negative numbers, and work with absolute value.</p>
    </div>

    <section class="card panel" aria-label="Exercise">
      <p id="question" class="question" aria-live="polite"></p>
      <form id="form" novalidate autocomplete="off">
        <label for="answer" class="visually-hidden">Your answer</label>
        <div class="answer-row">
          <input id="answer" class="input" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="Answer" aria-describedby="hint error">
          <button id="action" class="btn" type="submit">Check</button>
        </div>
        <p id="hint" class="field-hint small muted" hidden></p>
        <p id="error" class="field-error" role="alert" hidden></p>
      </form>
      <div id="feedback" class="feedback" aria-live="polite"></div>
    </section>
  </main>

  <script src="../../assets/practice.js"></script>
  <script>
    (function (M) {
      M.practice({
        input: 'number',
        generate: function () {
          var n = M.num, o = M.operand, kind = M.pick(['+', '+', '-', '-', '*', '/', 'abs']);
          var a = M.randNZ(-20, 20), b = M.randNZ(-20, 20), ans, q, rows, note;
          if (kind === '+') {
            if (a > 0 && b > 0) a = -a;
            ans = a + b; q = n(a) + ' + ' + o(b);
            note = (a < 0) === (b < 0)
              ? 'Same signs: add the sizes and keep the sign.'
              : 'Different signs: subtract the smaller size from the larger, and take the sign of the larger.';
            rows = [[q, '= <strong>' + n(ans) + '</strong>']];
          } else if (kind === '-') {
            if (a > 0 && b > 0) b = -b;
            ans = a - b; q = n(a) + ' − ' + o(b);
            rows = [[q, '= ' + n(a) + ' + ' + o(-b)], ['', '= <strong>' + n(ans) + '</strong>']];
            note = 'Subtracting a number is the same as adding its opposite.';
          } else if (kind === '*') {
            a = M.randNZ(-12, 12); b = M.randNZ(-12, 12);
            if (a > 0 && b > 0) a = -a;
            ans = a * b; q = n(a) + ' × ' + o(b);
            rows = [[q, '= <strong>' + n(ans) + '</strong>']];
            note = (a < 0) === (b < 0) ? 'Same signs multiply to a positive.' : 'Different signs multiply to a negative.';
          } else if (kind === '/') {
            b = M.randNZ(-12, 12); var k = M.randNZ(-12, 12);
            if (b > 0 && k > 0) b = -b;
            a = b * k; ans = k; q = n(a) + ' ÷ ' + o(b);
            rows = [[q, '= <strong>' + n(ans) + '</strong>']];
            note = (a < 0) === (b < 0) ? 'Same signs divide to a positive.' : 'Different signs divide to a negative.';
          } else {
            if (Math.random() < .5) {
              ans = Math.abs(a) - Math.abs(b); q = M.abs(n(a)) + ' − ' + M.abs(n(b));
              rows = [[q, '= ' + Math.abs(a) + ' − ' + Math.abs(b)], ['', '= <strong>' + n(ans) + '</strong>']];
            } else {
              ans = Math.abs(a - b); q = M.abs(n(a) + ' − ' + o(b));
              rows = [[q, '= ' + M.abs(n(a - b))], ['', '= <strong>' + n(ans) + '</strong>']];
            }
            note = 'Absolute value is the distance from zero, so it is never negative.';
          }
          return { question: q, answer: ans, solution: M.steps(rows) + M.note(note) };
        }
      });
    })(IterMath);
  </script>
</body>
</html>
