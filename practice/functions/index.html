<head>

<body>
  <header class="container container--narrow topbar">
    <a class="back" href="../../" aria-label="All modules"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg><img src="../../assets/itermath-logo.svg" alt="" width="104" height="37"></a>
  </header>

  <main class="container container--narrow">
    <div class="practice-header">
      <p class="eyebrow small muted">Algebra · Grades 9–11</p>
      <h1 class="h1">Functions</h1>
      <p class="lead">Evaluate functions, compose them, and work with inverse functions.</p>
    </div>

    <section class="card panel" aria-label="Exercise">
      <p id="question" class="question" aria-live="polite"></p>
      <form id="form" novalidate autocomplete="off">
        <label for="answer" class="visually-hidden">Your answer</label>
        <div class="answer-row">
          <input id="answer" class="input" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="Answer" aria-describedby="hint error">
          <button id="action" class="btn" type="submit">Check</button>
        </div>
        <p id="hint" class="field-hint small muted" hidden></p>
        <p id="error" class="field-error" role="alert" hidden></p>
      </form>
      <div id="feedback" class="feedback" aria-live="polite"></div>
    </section>
  </main>

  <script src="../../assets/practice.js"></script>
  <script>
    (function (M) {
      M.practice({
        input: 'number',
        generate: function () {
          var n = M.num, P = M.poly, f = M.v('f'), g = M.v('g'), x = M.v('x'), t = M.rand(1, 4);
          var a = M.randNZ(-5, 5), b = M.randNZ(-9, 9), c = M.randNZ(-6, 6);
          var fx = function (v) { return f + '(' + v + ')'; }, gx = function (v) { return g + '(' + v + ')'; };
          if (t === 1) {
            var A = M.rand(1, 3), v = M.rand(-5, 5), val = A * v * v + c * v + b;
            return {
              prompt: fx(x) + ' = ' + P([A, c, b]), question: fx(n(v)), answer: val,
              solution: M.steps([[fx(n(v)), '= ' + (A === 1 ? '' : A) + M.pow('(' + n(v) + ')', 2) + ' ' + (c < 0 ? '−' : '+') + ' ' + Math.abs(c) + '(' + n(v) + ') ' + (b < 0 ? '−' : '+') + ' ' + Math.abs(b)], ['', '= <strong>' + n(val) + '</strong>']])
            };
          }
          if (t === 2) {
            var v2 = M.rand(-4, 4), gv = c * v2 + b, fv = a * gv * gv - b;
            return {
              prompt: fx(x) + ' = ' + P([a, 0, -b]) + ' and ' + gx(x) + ' = ' + P([c, b]), question: fx(gx(n(v2))), answer: fv,
              solution: M.steps([[gx(n(v2)), '= ' + n(c) + '(' + n(v2) + ') ' + (b < 0 ? '−' : '+') + ' ' + Math.abs(b) + ' = ' + n(gv)], [fx(n(gv)), '= ' + n(a) + M.pow('(' + n(gv) + ')', 2) + ' ' + (-b < 0 ? '−' : '+') + ' ' + Math.abs(b) + ' = <strong>' + n(fv) + '</strong>']]) +
                M.note('Work from the inside out.')
            };
          }
          var xv = M.rand(-8, 8), out = a * xv + b;
          if (t === 3) {
            return {
              prompt: fx(x) + ' = ' + P([a, b]), question: M.pow(f, '−1') + '(' + n(out) + ')', answer: xv,
              solution: M.steps([[n(out), '= ' + P([a, b])], [M.terms([[a, x]]), '= ' + n(out) + ' − ' + M.operand(b) + ' = ' + n(out - b)], [x, '= <strong>' + n(xv) + '</strong>']]) +
                M.note(M.pow(f, '−1') + '(' + n(out) + ') is the input that gives ' + fx(x) + ' = ' + n(out) + '.')
            };
          }
          return {
            prompt: fx(x) + ' = ' + P([a, b]) + '. Find ' + x + ' when ' + fx(x) + ' = ' + n(out) + '.', question: x, answer: xv, placeholder: 'x =',
            solution: M.steps([[P([a, b]), '= ' + n(out)], [M.terms([[a, x]]), '= ' + n(out - b)], [x, '= <strong>' + n(xv) + '</strong>']])
          };
        }
      });
    })(IterMath);
  </script>
</body>
</html>
