<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="description" content="Find slopes, intercepts and values from y = mx + b and Ax + By = C. Instant feedback and a worked solution for every miss.">

  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">

  <meta property="og:title" content="Linear functions practice · IterMath">
  <meta property="og:description" content="Find slopes, intercepts and values from y = mx + b and Ax + By = C. Instant feedback and a worked solution for every miss.">

<body>
  <header class="container container--narrow topbar">
    <a class="back" href="../../" aria-label="All modules"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg><img src="../../assets/itermath-logo.svg" alt="" width="104" height="37"></a>
  </header>

  <main class="container container--narrow">
    <div class="practice-header">
      <p class="eyebrow small muted">Algebra · Grades 8–9</p>
      <h1 class="h1">Linear functions</h1>
      <p class="lead">Find slopes, intercepts and values from y = mx + b and Ax + By = C.</p>
    </div>

    <section class="card panel" aria-label="Exercise">
      <p id="question" class="question" aria-live="polite"></p>
      <form id="form" novalidate autocomplete="off">
        <label for="answer" class="visually-hidden">Your answer</label>
        <div class="answer-row">
          <input id="answer" class="input" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="Answer" aria-describedby="hint error">
          <button id="action" class="btn" type="submit">Check</button>
        </div>
        <p id="hint" class="field-hint small muted">Fractions are fine, like −2/3.</p>
        <p id="error" class="field-error" role="alert" hidden></p>
      </form>
      <div id="feedback" class="feedback" aria-live="polite"></div>
    </section>
  </main>

  <script src="../../assets/practice.js"></script>
  <script>
    (function (M) {
      M.practice({
        input: 'number',
        generate: function () {
          var n = M.num, x = M.v('x'), y = M.v('y'), m = M.randNZ(-6, 6), b = M.randNZ(-10, 10), t = M.rand(1, 5);
          var line = y + ' = ' + M.terms([[m, x], [b, '']]);
          if (t === 1) {
            var xv = M.rand(-6, 6), yv = m * xv + b;
            return { prompt: line, question: y + ' when ' + x + ' = ' + n(xv), answer: yv, hint: '', solution: M.steps([[y, '= ' + n(m) + '(' + n(xv) + ')' + (b < 0 ? ' − ' + -b : ' + ' + b)], ['', '= <strong>' + n(yv) + '</strong>']]) };
          }
          if (t === 2) {
            var ans = M.Q(-b, m);
            return { prompt: line, question: x + '-intercept', answer: ans, solution: M.steps([['0', '= ' + M.terms([[m, x], [b, '']])], [M.terms([[m, x]]), '= ' + n(-b)], [x, '= <strong>' + M.q(ans) + '</strong>']]) + M.note('The ' + x + '-intercept is where ' + y + ' = 0.') };
          }
          var A = M.randNZ(-6, 6), B = M.randNZ(-6, 6), C = M.randNZ(-12, 12);
          var std = M.terms([[A, x], [B, y]]) + ' = ' + n(C);
          if (t === 3) {
            var sl = M.Q(-A, B);
            return { prompt: std, question: 'Slope', answer: sl, solution: M.steps([[M.terms([[B, y]]), '= ' + M.terms([[-A, x], [C, '']])], [y, '= ' + M.terms([[sl, x], [M.Q(C, B), '']])], ['<i>m</i>', '= <strong>' + M.q(sl) + '</strong>']]) + M.note('Rearrange into ' + y + ' = <i>mx</i> + <i>b</i>.') };
          }
          if (t === 4) {
            var yi = M.Q(C, B);
            return { prompt: std, question: y + '-intercept', answer: yi, solution: M.steps([['set ' + x + ' = 0:', M.terms([[B, y]]) + ' = ' + n(C)], [y, '= <strong>' + M.q(yi) + '</strong>']]) };
          }
          var x1 = M.rand(-5, 5), x2; do { x2 = M.rand(-5, 5); } while (x2 === x1);
          var y1 = m * x1 + b, y2 = m * x2 + b;
          return {
            prompt: 'A line passes through (' + n(x1) + ', ' + n(y1) + ') and (' + n(x2) + ', ' + n(y2) + ').', question: '<i>y</i>-intercept <i>b</i>', answer: b, hint: '',
            solution: M.steps([['<i>m</i>', '= ' + M.frac(n(y2) + ' − ' + M.operand(y1), n(x2) + ' − ' + M.operand(x1)) + ' = ' + n(m)], [n(y1), '= ' + n(m) + '(' + n(x1) + ') + <i>b</i>'], ['<i>b</i>', '= ' + n(y1) + ' − ' + M.operand(m * x1) + ' = <strong>' + n(b) + '</strong>']])
          };
        }
      });
    })(IterMath);
  </script>
</body>
</html>
