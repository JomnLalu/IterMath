  <meta name="description" content="Find the greatest common factor and the least common multiple of two numbers. Instant feedback and a worked solution for every miss.">

  <meta property="og:title" content="GCF and LCM practice · IterMath">

<body>
  <header class="container container--narrow topbar">
    <a class="back" href="../../" aria-label="All modules"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg><img src="../../assets/itermath-logo.svg" alt="" width="104" height="37"></a>
  </header>

  <main class="container container--narrow">
    <div class="practice-header">
      <p class="eyebrow small muted">Integers, powers and factors · Grades 4–6</p>
      <h1 class="h1">GCF and LCM</h1>
      <p class="lead">Find the greatest common factor and the least common multiple of two numbers.</p>
    </div>

    <section class="card panel" aria-label="Exercise">
      <p id="question" class="question" aria-live="polite"></p>
      <form id="form" novalidate autocomplete="off">
        <label for="answer" class="visually-hidden">Your answer</label>
        <div class="answer-row">
          <input id="answer" class="input" type="text" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done" placeholder="Answer" aria-describedby="hint error">
          <button id="action" class="btn" type="submit">Check</button>
        </div>
        <p id="hint" class="field-hint small muted" hidden></p>
        <p id="error" class="field-error" role="alert" hidden></p>
      </form>
      <div id="feedback" class="feedback" aria-live="polite"></div>
    </section>
  </main>

  <script src="../../assets/practice.js"></script>
  <script>
    (function (M) {
      M.practice({
        allowNegative: false,
        generate: function () {
          function fs(x) {
            var f = M.primeFactors(x), out = [], i = 0;
            while (i < f.length) { var j = i; while (j < f.length && f[j] === f[i]) j++; out.push(j - i > 1 ? M.pow(f[i], j - i) : String(f[i])); i = j; }
            return out.join(' × ');
          }
          var g = M.rand(2, 12), m1, m2;
          do { m1 = M.rand(1, 9); m2 = M.rand(2, 10); } while (m1 === m2 || M.gcd(m1, m2) !== 1);
          var a = g * m1, b = g * m2, l = g * m1 * m2;
          if (Math.random() < .5) { var tmp = a; a = b; b = tmp; }
          var rows = [[String(a), '= ' + fs(a)], [String(b), '= ' + fs(b)]];
          if (Math.random() < .5) {
            return {
              question: 'GCF(' + a + ', ' + b + ')', answer: g,
              solution: M.steps(rows) + M.note('Multiply the prime factors they share: ' + fs(g) + ' = <strong>' + g + '</strong>.')
            };
          }
          return {
            question: 'LCM(' + a + ', ' + b + ')', answer: l,
            solution: M.steps(rows) + M.note('Take each prime the most times it appears in either number: ' + fs(l) + ' = <strong>' + l + '</strong>.')
          };
        }
      });
    })(IterMath);
  </script>
</body>
</html>
