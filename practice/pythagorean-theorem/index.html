<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pythagorean theorem practice · IterMath</title>
  <meta name="description" content="Find a missing side of a right triangle with a^2 + b^2 = c^2. Instant feedback and a worked solution for every miss.">
  <link rel="canonical" href="https://itermath.jomontolalu.com/practice/pythagorean-theorem/">
  <meta name="theme-color" content="#fafafa">
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="IterMath">
  <meta property="og:title" content="Pythagorean theorem practice · IterMath">
  <meta property="og:description" content="Find a missing side of a right triangle with a^2 + b^2 = c^2. Instant feedback and a worked solution for every miss.">
  <meta property="og:url" content="https://itermath.jomontolalu.com/practice/pythagorean-theorem/">
  <meta property="og:image" content="https://itermath.jomontolalu.com/assets/og.png">

</head>
<body>
  <header class="container container--narrow topbar">
    <a class="back" href="../../" aria-label="All modules"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg><img src="../../assets/itermath-logo.svg" alt="" width="104" height="37"></a>
  </header>

  <main class="container container--narrow">
    <div class="practice-header">
      <p class="eyebrow small muted">Geometry and measurement · Grades 8–9</p>
      <h1 class="h1">Pythagorean theorem</h1>
      <p class="lead">Find a missing side of a right triangle with a<sup>2</sup> + b<sup>2</sup> = c<sup>2</sup>.</p>
    </div>

    <section class="card panel" aria-label="Exercise">
      <p id="question" class="question" aria-live="polite"></p>
      <form id="form" novalidate autocomplete="off">
        <label for="answer" class="visually-hidden">Your answer</label>
        <div class="answer-row">
          <input id="answer" class="input" type="text" inputmode="decimal" enterkeyhint="done" placeholder="Answer" aria-describedby="hint error">
          <button id="action" class="btn" type="submit">Check</button>
        </div>
        <p id="hint" class="field-hint small muted" hidden></p>
        <p id="error" class="field-error" role="alert" hidden></p>
      </form>
      <div id="feedback" class="feedback" aria-live="polite"></div>
    </section>
  </main>

  <script src="../../assets/practice.js"></script>
  <script>
    (function (M) {
      M.practice({
        input: 'number',
        generate: function () {
          var triples = [[3, 4, 5], [5, 12, 13], [8, 15, 17], [7, 24, 25], [20, 21, 29], [9, 40, 41]];
          var tr = M.pick(triples), k = tr[2] <= 13 ? M.rand(1, 4) : 1, a = tr[0] * k, b = tr[1] * k, c = tr[2] * k;
          if (Math.random() < .5) { var s = a; a = b; b = s; }
          var x = '<tspan font-style="italic">x</tspan>', t = M.rand(1, 3);
          if (t === 1) {
            return {
              question: M.triangle({ opp: a, adj: b, hyp: x }) + '<i>x</i>', answer: c, hint: '',
              solution: M.steps([[M.pow('<i>x</i>', 2), '= ' + M.pow(a, 2) + ' + ' + M.pow(b, 2)], ['', '= ' + a * a + ' + ' + b * b + ' = ' + c * c], ['<i>x</i>', '= ' + M.sqrt(c * c) + ' = <strong>' + c + '</strong>']]) +
                M.note('The hypotenuse is the side opposite the right angle.')
            };
          }
          if (t === 2) {
            return {
              question: M.triangle({ opp: x, adj: b, hyp: c }) + '<i>x</i>', answer: a, hint: '',
              solution: M.steps([[M.pow('<i>x</i>', 2), '= ' + M.pow(c, 2) + ' − ' + M.pow(b, 2)], ['', '= ' + c * c + ' − ' + b * b + ' = ' + a * a], ['<i>x</i>', '= ' + M.sqrt(a * a) + ' = <strong>' + a + '</strong>']]) +
                M.note('To find a shorter side, subtract from the hypotenuse squared.')
            };
          }
          var p = M.rand(2, 12), q = M.rand(2, 12), h2 = p * p + q * q;
          while (Math.sqrt(h2) === Math.round(Math.sqrt(h2))) { q++; h2 = p * p + q * q; }
          var hyp = M.round(Math.sqrt(h2), 1);
          return {
            question: M.triangle({ opp: p, adj: q, hyp: x }) + '<i>x</i>', ask: '≈ <span class="muted">?</span>', answer: hyp, places: 1, display: hyp.toFixed(1), hint: 'Round to 1 decimal place.',
            solution: M.steps([[M.pow('<i>x</i>', 2), '= ' + M.pow(p, 2) + ' + ' + M.pow(q, 2) + ' = ' + h2], ['<i>x</i>', '= ' + M.sqrt(h2) + ' ≈ <strong>' + hyp + '</strong>']])
          };
        }
      });
    })(IterMath);
  </script>
</body>
</html>
