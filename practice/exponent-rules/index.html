<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Exponent rules practice · IterMath</title>
  <meta name="description" content="Use the product, quotient and power rules, including zero and negative exponents. Instant feedback and a worked solution for every miss.">
  <link rel="canonical" href="https://itermath.jomontolalu.com/practice/exponent-rules/">
  <meta name="theme-color" content="#fafafa">
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="IterMath">
  <meta property="og:title" content="Exponent rules practice · IterMath">
  <meta property="og:description" content="Use the product, quotient and power rules, including zero and negative exponents. Instant feedback and a worked solution for every miss.">
  <meta property="og:url" content="https://itermath.jomontolalu.com/practice/exponent-rules/">
  <meta property="og:image" content="https://itermath.jomontolalu.com/assets/og.png">
  <meta property="og:image:width" content="1200">

</head>
<body>
  <header class="container container--narrow topbar">
    <a class="back" href="../../" aria-label="All modules"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg><img src="../../assets/itermath-logo.svg" alt="" width="104" height="37"></a>
  </header>

  <main class="container container--narrow">
    <div class="practice-header">
      <p class="eyebrow small muted">Algebra · Grades 8–9</p>
      <h1 class="h1">Exponent rules</h1>
      <p class="lead">Use the product, quotient and power rules, including zero and negative exponents.</p>
    </div>

    <section class="card panel" aria-label="Exercise">
      <p id="question" class="question" aria-live="polite"></p>
      <form id="form" novalidate autocomplete="off">
        <label for="answer" class="visually-hidden">Your answer</label>
        <div class="answer-row">
          <input id="answer" class="input" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="Answer" aria-describedby="hint error">
          <button id="action" class="btn" type="submit">Check</button>
        </div>
        <p id="hint" class="field-hint small muted" hidden></p>
        <p id="error" class="field-error" role="alert" hidden></p>
      </form>
      <div id="feedback" class="feedback" aria-live="polite"></div>
    </section>
  </main>

  <script src="../../assets/practice.js"></script>
  <script>
    (function (M) {
      M.practice({
        input: 'number',
        generate: function () {
          var n = M.num, b = M.pick([M.v('x'), M.v('a'), M.v('y'), '2', '3', '5']), t = M.rand(1, 4);
          var p = M.rand(2, 9), q = M.rand(2, 9), ans, q1, rule, show;
          var ask = '= ' + M.pow(b, '<span class="muted">?</span>');
          if (t === 1) { ans = p + q; q1 = M.pow(b, p) + ' · ' + M.pow(b, q); rule = 'When multiplying, add the exponents: ' + p + ' + ' + q + ' = ' + ans + '.'; }
          else if (t === 2) { ans = p - q; q1 = M.frac(M.pow(b, p), M.pow(b, q)); rule = 'When dividing, subtract the exponents: ' + p + ' − ' + q + ' = ' + n(ans) + '.'; }
          else if (t === 3) { q = M.rand(2, 5); ans = p * q; q1 = M.pow('(' + M.pow(b, p) + ')', q); rule = 'A power of a power multiplies the exponents: ' + p + ' × ' + q + ' = ' + ans + '.'; }
          else { q = M.rand(2, 12); ans = p - q; q1 = M.pow(b, p) + ' · ' + M.pow(b, n(-q)); rule = 'Add the exponents: ' + p + ' + (' + n(-q) + ') = ' + n(ans) + '.'; }
          show = M.pow(b, n(ans));
          return {
            prompt: 'Find the missing exponent.', question: q1, ask: ask, answer: ans, display: show,
            solution: M.steps([[q1, '= <strong>' + show + '</strong>']]) + M.note(rule + (ans < 0 ? ' A negative exponent means one over that power.' : ans === 0 ? ' Anything nonzero to the power 0 is 1.' : ''))
          };
        }
      });
    })(IterMath);
  </script>
</body>
</html>
