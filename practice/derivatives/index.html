<body>
  <header class="container container--narrow topbar">
    <a class="back" href="../../" aria-label="All modules"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg><img src="../../assets/itermath-logo.svg" alt="" width="104" height="37"></a>
  </header>

  <main class="container container--narrow">
    <div class="practice-header">
      <p class="eyebrow small muted">Calculus · Grades 11–12</p>
      <h1 class="h1">Derivatives</h1>
      <p class="lead">Differentiate polynomials with the power rule, find slopes of tangent lines and use the chain rule.</p>
    </div>

    <section class="card panel" aria-label="Exercise">
      <p id="question" class="question" aria-live="polite"></p>
      <form id="form" novalidate autocomplete="off">
        <label for="answer" class="visually-hidden">Your answer</label>
        <div class="answer-row">
          <input id="answer" class="input" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="Answer" aria-describedby="hint error">
          <button id="action" class="btn" type="submit">Check</button>
        </div>
        <p id="hint" class="field-hint small muted" hidden></p>
        <p id="error" class="field-error" role="alert" hidden></p>
      </form>
      <div id="feedback" class="feedback" aria-live="polite"></div>
    </section>
  </main>

  <script src="../../assets/practice.js"></script>
  <script>
    (function (M) {
      M.practice({
        input: 'number',
        generate: function () {
          var n = M.num, P = M.poly, x = M.v('x'), t = M.rand(1, 3), f = M.v('f');
          var deg = M.rand(2, 4), c = [M.randNZ(-5, 5)];
          for (var i = 0; i < deg; i++) c.push(M.rand(-9, 9));
          var d = c.slice(0, -1).map(function (k, i2) { return k * (deg - i2); });
          if (t === 1) {
            return {
              prompt: 'Differentiate.', question: f + '(' + x + ') = ' + P(c), ask: false,
              answer: M.polyText(d), sample: M.polyText(d), check: M.polyCheck(d), display: f + '′(' + x + ') = ' + P(d),
              placeholder: "f'(x) =", hint: 'Type powers with ^, like 6x^2 - 4x + 1.',
              solution: M.steps([[f + '′(' + x + ')', '= <strong>' + P(d) + '</strong>']]) + M.note('Power rule: the derivative of <i>a</i>' + M.pow(x, '<i>n</i>') + ' is <i>na</i>' + M.pow(x, '<i>n</i> − 1') + '. Constants become 0.')
            };
          }
          if (t === 2) {
            var a = M.rand(-3, 3), val = 0;
            d.forEach(function (k, i3) { val += k * Math.pow(a, d.length - 1 - i3); });
            return {
              prompt: f + '(' + x + ') = ' + P(c) + '. Find the slope of the tangent line at ' + x + ' = ' + n(a) + '.', question: f + '′(' + n(a) + ')', answer: val, hint: '',
              solution: M.steps([[f + '′(' + x + ')', '= ' + P(d)], [f + '′(' + n(a) + ')', '= <strong>' + n(val) + '</strong>']])
            };
          }
          var A = M.rand(1, 3), B = M.rand(-3, 3), k = M.rand(2, 4), x0 = M.rand(-2, 2), inner = A * x0 + B, val2 = k * A * Math.pow(inner, k - 1);
          var g = M.pow('(' + P([A, B]) + ')', k);
          return {
            prompt: f + '(' + x + ') = ' + g + '.', question: f + '′(' + n(x0) + ')', answer: val2, hint: '',
            solution: M.steps([[f + '′(' + x + ')', '= ' + k + M.pow('(' + P([A, B]) + ')', k - 1) + ' · ' + A], [f + '′(' + n(x0) + ')', '= ' + k + ' · ' + M.pow(M.operand(inner), k - 1) + ' · ' + A], ['', '= <strong>' + n(val2) + '</strong>']]) +
              M.note('Chain rule: differentiate the outside, then multiply by the derivative of the inside.')
          };
        }
      });
    })(IterMath);
  </script>
</body>
</html>
