<html lang="en">
<head>
  <meta charset="utf-8">

  <meta name="description" content="Substitute values for the variables and work out the expression. Instant feedback and a worked solution for every miss.">

  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png">

  <meta property="og:title" content="Evaluating expressions practice · IterMath">
  <meta property="og:description" content="Substitute values for the variables and work out the expression. Instant feedback and a worked solution for every miss.">

</head>
<body>
  <header class="container container--narrow topbar">
    <a class="back" href="../../" aria-label="All modules"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg><img src="../../assets/itermath-logo.svg" alt="" width="104" height="37"></a>
  </header>

  <main class="container container--narrow">
    <div class="practice-header">
      <p class="eyebrow small muted">Algebra · Grades 6–7</p>
      <h1 class="h1">Evaluating expressions</h1>
      <p class="lead">Substitute values for the variables and work out the expression.</p>
    </div>

    <section class="card panel" aria-label="Exercise">
      <p id="question" class="question" aria-live="polite"></p>
      <form id="form" novalidate autocomplete="off">
        <label for="answer" class="visually-hidden">Your answer</label>
        <div class="answer-row">
          <input id="answer" class="input" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="Answer" aria-describedby="hint error">
          <button id="action" class="btn" type="submit">Check</button>
        </div>
        <p id="hint" class="field-hint small muted" hidden></p>
        <p id="error" class="field-error" role="alert" hidden></p>
      </form>
      <div id="feedback" class="feedback" aria-live="polite"></div>
    </section>
  </main>

  <script src="../../assets/practice.js"></script>
  <script>
    (function (M) {
      M.practice({
        input: 'number',
        generate: function () {
          var n = M.num, o = M.operand, x = M.v('x'), y = M.v('y');
          var a = M.randNZ(-9, 9), b = M.randNZ(-15, 15), c = M.randNZ(-9, 9);
          var xv = M.randNZ(-6, 8), yv = M.randNZ(-5, 6), t = M.rand(1, 5), expr, sub, val, mid, two = false;
          var p = function (v) { return '(' + n(v) + ')'; };
          var plus = function (k) { return k < 0 ? ' − ' + Math.abs(k) : ' + ' + k; };
          var cf = function (k) { return k === 1 ? '' : k === -1 ? '−' : n(k); };
          if (t === 1) { expr = M.terms([[a, x], [b, '']]); sub = cf(a) + p(xv) + plus(b); mid = n(a * xv) + plus(b); val = a * xv + b; }
          else if (t === 2) {
            a = M.rand(1, 4);
            expr = M.terms([[a, M.pow(x, 2)], [c, x], [b, '']]);
            sub = (a === 1 ? '' : a) + M.pow(p(xv), 2) + (c < 0 ? ' − ' + (c === -1 ? '' : Math.abs(c)) : ' + ' + (c === 1 ? '' : c)) + p(xv) + plus(b);
            mid = n(a * xv * xv) + plus(c * xv) + plus(b); val = a * xv * xv + c * xv + b;
          }
          else if (t === 3) { if (Math.abs(a) === 1) a = 3 * a; expr = n(a) + '(' + M.terms([[1, x], [b, '']]) + ')'; sub = n(a) + '(' + n(xv) + plus(b) + ')'; mid = a + ' × ' + o(xv + b); val = a * (xv + b); }
          else if (t === 4) { two = true; expr = M.terms([[a, x + y], [c, y]]); sub = cf(a) + p(xv) + p(yv) + (c < 0 ? ' − ' + (c === -1 ? '' : Math.abs(c)) : ' + ' + (c === 1 ? '' : c)) + p(yv); mid = n(a * xv * yv) + plus(c * yv); val = a * xv * yv + c * yv; }
          else {
            two = true; var d = M.rand(2, 6);
            do { xv = M.randNZ(-9, 12); yv = M.randNZ(-9, 12); } while ((xv + yv) % d || xv + yv === 0);
            expr = M.frac(x + ' + ' + y, d); sub = M.frac(n(xv) + ' + ' + o(yv), d); mid = M.frac(n(xv + yv), d); val = (xv + yv) / d;
          }
          return {
            prompt: 'Evaluate when ' + x + ' = ' + n(xv) + (two ? ' and ' + y + ' = ' + n(yv) : '') + '.',
            question: expr, answer: val,
            solution: M.steps([[expr, '= ' + sub], ['', '= ' + mid], ['', '= <strong>' + n(val) + '</strong>']]) +
              M.note('Put each value in brackets, then follow the order of operations.')
          };
        }
      });
    })(IterMath);
  </script>
</body>
</html>
