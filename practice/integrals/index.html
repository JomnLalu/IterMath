  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">

  <meta property="og:title" content="Integrals practice · IterMath">
  <meta property="og:description" content="Find antiderivatives of polynomials and evaluate definite integrals. Instant feedback and a worked solution for every miss.">
  <meta property="og:url" content="https://itermath.jomontolalu.com/practice/integrals/">

</head>
<body>
  <header class="container container--narrow topbar">
    <a class="back" href="../../" aria-label="All modules"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg><img src="../../assets/itermath-logo.svg" alt="" width="104" height="37"></a>
  </header>

  <main class="container container--narrow">
    <div class="practice-header">
      <p class="eyebrow small muted">Calculus · Grades 11–12</p>
      <h1 class="h1">Integrals</h1>
      <p class="lead">Find antiderivatives of polynomials and evaluate definite integrals.</p>
    </div>

    <section class="card panel" aria-label="Exercise">
      <p id="question" class="question" aria-live="polite"></p>
      <form id="form" novalidate autocomplete="off">
        <label for="answer" class="visually-hidden">Your answer</label>
        <div class="answer-row">
          <input id="answer" class="input" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="Answer" aria-describedby="hint error">
          <button id="action" class="btn" type="submit">Check</button>
        </div>
        <p id="hint" class="field-hint small muted" hidden></p>
        <p id="error" class="field-error" role="alert" hidden></p>
      </form>
      <div id="feedback" class="feedback" aria-live="polite"></div>
    </section>
  </main>

  <script src="../../assets/practice.js"></script>
  <script>
    (function (M) {
      M.practice({
        input: 'number',
        generate: function () {
          var n = M.num, P = M.poly, x = M.v('x'), dx = ' <i>dx</i>';
          if (Math.random() < .4) {
            var deg = M.rand(1, 3), F = [M.randNZ(-4, 4)];
            for (var i = 0; i < deg; i++) F.push(M.rand(-6, 6));
            F.push(0);
            var top = F.length - 1, f = F.slice(0, -1).map(function (k, j) { return k * (top - j); });
            var want = M.polyFrom(F.slice(0, -1).concat([0]));
            return {
              prompt: 'Find the antiderivative.', question: '∫ (' + P(f) + ')' + dx, ask: false,
              answer: M.polyText(F) + '+C', sample: M.polyText(F) + ' + C', display: P(F) + ' + <i>C</i>',
              placeholder: '... + C', hint: 'Type powers with ^ and finish with + C.',
              check: function (raw) {
                var s = raw.replace(/\s+/g, '');
                if (!/\+c$/i.test(s) && !/^c\+/i.test(s)) return 'Add the constant of integration, + C.';
                s = s.replace(/\+c$/i, '').replace(/^c\+/i, '');
                var got = M.parsePoly(s);
                if (!got) return 'Type it like x^3 - 2x^2 + 5x + C.';
                delete got[0];
                return M.polyEq(got, want);
              },
              solution: M.steps([['', '= <strong>' + P(F) + ' + <i>C</i></strong>']]) + M.note('Raise each power by one and divide by the new power. Check by differentiating.')
            };
          }
          var c2 = M.rand(-3, 3), c1 = M.rand(-6, 6), c0 = M.rand(-6, 6);
          if (!c2 && !c1) c1 = 2;
          var a = M.rand(-3, 2), b = M.rand(a + 1, 4);
          var Fq = function (v) { return M.qadd(M.qadd(M.Q(c2 * v * v * v, 3), M.Q(c1 * v * v, 2)), M.Q(c0 * v, 1)); };
          var ans = M.qsub(Fq(b), Fq(a));
          var Fhtml = M.terms([[M.Q(c2, 3), M.pow(x, 3)], [M.Q(c1, 2), M.pow(x, 2)], [c0, x]]);
          return {
            question: M.integral(n(a), n(b)) + '(' + P([c2, c1, c0]) + ')' + dx, answer: ans,
            hint: 'Exact answers. Fractions are fine, like 14/3.',
            solution: M.steps([['', '= [' + Fhtml + ']<sub>' + n(a) + '</sub><sup>' + n(b) + '</sup>'], ['', '= ' + M.q(Fq(b)) + ' − ' + (Fq(a).n < 0 ? '(' + M.q(Fq(a)) + ')' : M.q(Fq(a)))], ['', '= <strong>' + M.q(ans) + '</strong>']]) +
              M.note('Find the antiderivative <i>F</i>, then work out <i>F</i>(' + n(b) + ') − <i>F</i>(' + n(a) + ').')
          };
        }
      });
    })(IterMath);
  </script>
</body>
</html>
