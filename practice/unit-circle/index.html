<body>
  <header class="container container--narrow topbar">
    <a class="back" href="../../" aria-label="All modules"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg><img src="../../assets/itermath-logo.svg" alt="" width="104" height="37"></a>
  </header>

  <main class="container container--narrow">
    <div class="practice-header">
      <p class="eyebrow small muted">Advanced algebra and trigonometry · Grades 10–12</p>
      <h1 class="h1">Unit circle and radians</h1>
      <p class="lead">Give exact values of sine, cosine and tangent, and convert between degrees and radians.</p>
    </div>

    <section class="card panel" aria-label="Exercise">
      <p id="question" class="question" aria-live="polite"></p>
      <form id="form" novalidate autocomplete="off">
        <label for="answer" class="visually-hidden">Your answer</label>
        <div class="answer-row">
          <input id="answer" class="input" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="Answer" aria-describedby="hint error">
          <button id="action" class="btn" type="submit">Check</button>
        </div>
        <p id="hint" class="field-hint small muted" hidden></p>
        <p id="error" class="field-error" role="alert" hidden></p>
      </form>
      <div id="feedback" class="feedback" aria-live="polite"></div>
    </section>
  </main>

  <script src="../../assets/practice.js"></script>
  <script>
    (function (M) {
      M.practice({
        input: 'number',
        generate: function () {
          var angles = [0, 30, 45, 60, 90, 120, 135, 150, 180, 210, 225, 240, 270, 300, 315, 330];
          var A = M.pick(angles), t = M.rand(1, 5), pi = '<i>π</i>';
          var radHTML = function (deg) {
            if (deg === 0) return '0';
            var q = M.Q(deg, 180), top = (q.n === 1 ? '' : q.n) + pi;
            return q.d === 1 ? top : M.frac(top, q.d);
          };
          if (t === 1) {
            var D = M.pick(angles.slice(1).concat([360, 75, 15, 105])), Rq = M.Q(D, 180);
            return {
              prompt: 'Convert to radians.', question: D + '°', ask: '= <span class="muted">?</span>' + pi, answer: Rq, form: 'fraction',
              display: radHTML(D), hint: 'Type the number in front of π, like 3/4.',
              solution: M.steps([[D + '°', '= ' + D + ' × ' + M.frac(pi, 180)], ['', '= <strong>' + radHTML(D) + '</strong>']])
            };
          }
          if (t === 2) {
            var D2 = M.pick(angles.slice(1).concat([360]));
            return {
              prompt: 'Convert to degrees.', question: radHTML(D2), ask: '= <span class="muted">?</span>°', answer: D2, display: D2 + '°', hint: '',
              solution: M.steps([[radHTML(D2), '= ' + radHTML(D2) + ' × ' + M.frac(180, pi)], ['', '= <strong>' + D2 + '°</strong>']])
            };
          }
          var fn = M.pick(['sin', 'cos', 'tan']), ref = A % 180 === 0 ? 0 : A % 90 === 0 ? 90 : A < 90 ? A : A < 180 ? 180 - A : A < 270 ? A - 180 : 360 - A;
          var sinS = A > 180 ? -1 : 1, cosS = (A > 90 && A < 270) ? -1 : 1;
          var sinK = { 0: '0', 30: '1/2', 45: '√2/2', 60: '√3/2', 90: '1' }, cosK = { 0: '1', 30: '√3/2', 45: '√2/2', 60: '1/2', 90: '0' };
          var tanK = { 0: '0', 30: '√3/3', 45: '1', 60: '√3', 90: 'undefined' };
          var key, sign;
          if (fn === 'sin') { key = sinK[ref]; sign = sinS; if (A === 180) key = '0'; if (A === 270) { key = '1'; sign = -1; } }
          else if (fn === 'cos') { key = cosK[ref]; sign = cosS; if (A === 180) { key = '1'; sign = -1; } if (A === 90 || A === 270) key = '0'; }
          else { key = tanK[ref]; sign = sinS * cosS; if (A === 180) key = '0'; }
          if (A === 0 && fn === 'cos') { key = '1'; sign = 1; }
          if (key === '0' || key === 'undefined') sign = 1;
          var value = (sign < 0 ? '-' : '') + key;
          var alts = { '√2/2': ['1/√2'], '√3/3': ['1/√3'], '1/2': ['0.5'], 'undefined': ['undef', 'none', 'dne', 'doesnotexist'] };
          var accept = [value].concat((alts[key] || []).map(function (s) { return (sign < 0 ? '-' : '') + s; }));
          var html = function (k) {
            return { '0': '0', '1': '1', '1/2': M.frac(1, 2), '√2/2': M.frac(M.sqrt(2), 2), '√3/2': M.frac(M.sqrt(3), 2), '√3/3': M.frac(M.sqrt(3), 3), '√3': M.sqrt(3), 'undefined': 'undefined' }[k];
          };
          var show = (sign < 0 ? '−' : '') + html(key), angle = Math.random() < .5 ? A + '°' : radHTML(A);
          var quad = A % 90 === 0 ? 'on an axis' : 'in quadrant ' + ['I', 'II', 'III', 'IV'][Math.floor(A / 90)];
          return {
            prompt: 'Give the exact value.', question: fn + ' ' + angle, answer: value, accept: accept, display: show,
            sample: value.replace(/√/g, 'sqrt'), hint: 'Type √ as sqrt, like sqrt3/2. Type “undefined” if there is no value.',
            check: function (raw) {
              var s = M.normText(raw);
              for (var i = 0; i < accept.length; i++) if (M.normText(accept[i]) === s) return true;
              var p = M.parseNumber(raw, false);
              if (p && /^-?[01]$|^-?1\/2$/.test(value)) return M.qeq(p.value, M.toQ(value === '-1/2' ? -.5 : value === '1/2' ? .5 : parseInt(value, 10)));
              if (!p && !/√|sqrt|undef|none|dne|exist/i.test(raw)) return 'Type an exact value, like sqrt3/2 or -1/2.';
              return false;
            },
            solution: M.steps([[fn + ' ' + angle, '= <strong>' + show + '</strong>']]) +
              M.note(A + '° is ' + quad + (ref && A % 90 ? ', with reference angle ' + ref + '°' : '') + '. ' + (fn === 'sin' ? 'Sine is the y-coordinate on the unit circle.' : fn === 'cos' ? 'Cosine is the x-coordinate on the unit circle.' : 'Tangent is sine ÷ cosine.'))
          };
        }
      });
    })(IterMath);
  </script>
</body>
