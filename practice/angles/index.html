<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Angles practice · IterMath</title>
  <meta name="description" content="Find missing angles: complementary, supplementary, around a point, in triangles and in polygons. Instant feedback and a worked solution for every miss.">
  <link rel="canonical" href="https://itermath.jomontolalu.com/practice/angles/">
  <meta name="theme-color" content="#fafafa">
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="IterMath">
  <meta property="og:title" content="Angles practice · IterMath">
  <meta property="og:description" content="Find missing angles: complementary, supplementary, around a point, in triangles and in polygons. Instant feedback and a worked solution for every miss.">
  <meta property="og:url" content="https://itermath.jomontolalu.com/practice/angles/">
  <meta property="og:image" content="https://itermath.jomontolalu.com/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

</head>
<body>
  <header class="container container--narrow topbar">
    <a class="back" href="../../" aria-label="All modules"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg><img src="../../assets/itermath-logo.svg" alt="" width="104" height="37"></a>
  </header>

  <main class="container container--narrow">
    <div class="practice-header">
      <p class="eyebrow small muted">Geometry and measurement · Grades 4–8</p>
      <h1 class="h1">Angles</h1>
      <p class="lead">Find missing angles: complementary, supplementary, around a point, in triangles and in polygons.</p>
    </div>

    <section class="card panel" aria-label="Exercise">
      <p id="question" class="question" aria-live="polite"></p>
      <form id="form" novalidate autocomplete="off">
        <label for="answer" class="visually-hidden">Your answer</label>
        <div class="answer-row">
          <input id="answer" class="input" type="text" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done" placeholder="Answer" aria-describedby="hint error">
          <button id="action" class="btn" type="submit">Check</button>
        </div>
        <p id="hint" class="field-hint small muted" hidden></p>
        <p id="error" class="field-error" role="alert" hidden></p>
      </form>
      <div id="feedback" class="feedback" aria-live="polite"></div>
    </section>
  </main>

  <script src="../../assets/practice.js"></script>
  <script>
    (function (M) {
      M.practice({
        input: 'number',
        generate: function () {
          var deg = '°', ask = '= <span class="muted">?</span>°', t = M.rand(1, 8);
          var names = { 3: 'triangle', 4: 'quadrilateral', 5: 'pentagon', 6: 'hexagon', 7: 'heptagon', 8: 'octagon', 9: 'nonagon', 10: 'decagon', 12: 'dodecagon' };
          var poly = function (k) { return names[k] || k + '-sided polygon'; };
          var a = M.rand(5, 85);
          if (t === 1) return { prompt: 'Two angles are complementary. One is ' + a + deg + '.', question: 'The other', ask: ask, answer: 90 - a, display: (90 - a) + deg, solution: M.steps([['90° − ' + a + '°', '= <strong>' + (90 - a) + '°</strong>']]) + M.note('Complementary angles add up to 90°.') };
          if (t === 2) { a = M.rand(10, 170); return { prompt: 'Two angles are supplementary. One is ' + a + deg + '.', question: 'The other', ask: ask, answer: 180 - a, display: (180 - a) + deg, solution: M.steps([['180° − ' + a + '°', '= <strong>' + (180 - a) + '°</strong>']]) + M.note('Supplementary angles add up to 180°, like angles on a straight line.') }; }
          if (t === 3) {
            var x = M.rand(20, 110), y = M.rand(15, 160 - x);
            return { prompt: 'A triangle has angles of ' + x + deg + ' and ' + y + deg + '.', question: 'Third angle', ask: ask, answer: 180 - x - y, display: (180 - x - y) + deg, solution: M.steps([['180° − ' + x + '° − ' + y + '°', '= <strong>' + (180 - x - y) + '°</strong>']]) + M.note('The angles in a triangle add up to 180°.') };
          }
          if (t === 4) {
            var p = M.rand(40, 150), q = M.rand(40, 300 - p - 20);
            return { prompt: 'Three angles meet at a point. Two are ' + p + deg + ' and ' + q + deg + '.', question: 'Third angle', ask: ask, answer: 360 - p - q, display: (360 - p - q) + deg, solution: M.steps([['360° − ' + p + '° − ' + q + '°', '= <strong>' + (360 - p - q) + '°</strong>']]) + M.note('Angles around a point add up to 360°.') };
          }
          if (t === 5) {
            var apex = M.rand(10, 80) * 2, base = (180 - apex) / 2;
            return { prompt: 'An isosceles triangle has a top angle of ' + apex + deg + '.', question: 'Each base angle', ask: ask, answer: base, display: base + deg, solution: M.steps([['(180° − ' + apex + '°) ÷ 2', '= <strong>' + base + '°</strong>']]) + M.note('The two base angles of an isosceles triangle are equal.') };
          }
          if (t === 6) {
            var k = M.rand(5, 12), sum = (k - 2) * 180;
            return { prompt: 'Find the sum of the interior angles of a ' + poly(k) + '.', question: 'Sum', ask: ask, answer: sum, display: sum + deg, solution: M.steps([['(<i>n</i> − 2) × 180°', '= (' + k + ' − 2) × 180°'], ['', '= <strong>' + sum + '°</strong>']]) };
          }
          if (t === 7) {
            var m = M.pick([3, 4, 5, 6, 8, 9, 10, 12, 15, 18, 20]), each = (m - 2) * 180 / m;
            return { prompt: 'Find each interior angle of a regular ' + poly(m) + '.', question: 'Each angle', ask: ask, answer: each, display: each + deg, solution: M.steps([['(<i>n</i> − 2) × 180° ÷ <i>n</i>', '= (' + m + ' − 2) × 180° ÷ ' + m], ['', '= ' + (m - 2) * 180 + '° ÷ ' + m + ' = <strong>' + each + '°</strong>']]) };
          }
          var e = M.pick([3, 4, 5, 6, 8, 9, 10, 12, 15, 18, 20, 24, 30, 36]);
          return { prompt: 'Find each exterior angle of a regular ' + poly(e) + '.', question: 'Each angle', ask: ask, answer: 360 / e, display: 360 / e + deg, solution: M.steps([['360° ÷ ' + e, '= <strong>' + 360 / e + '°</strong>']]) + M.note('The exterior angles of any polygon add up to 360°.') };
        }
      });
    })(IterMath);
  </script>
</body>
</html>
