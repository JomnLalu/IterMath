<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Simplifying radicals practice · IterMath</title>
  <meta name="description" content="Simplify square roots, multiply them, and add or subtract like radicals. Instant feedback and a worked solution for every miss.">
  <link rel="canonical" href="https://itermath.jomontolalu.com/practice/radicals/">
  <meta name="theme-color" content="#fafafa">
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="IterMath">
  <meta property="og:title" content="Simplifying radicals practice · IterMath">
  <meta property="og:description" content="Simplify square roots, multiply them, and add or subtract like radicals. Instant feedback and a worked solution for every miss.">
  <meta property="og:url" content="https://itermath.jomontolalu.com/practice/radicals/">
  <meta property="og:image" content="https://itermath.jomontolalu.com/assets/og.png">

</head>
<body>
  <header class="container container--narrow topbar">
    <a class="back" href="../../" aria-label="All modules"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg><img src="../../assets/itermath-logo.svg" alt="" width="104" height="37"></a>
  </header>

  <main class="container container--narrow">
    <div class="practice-header">
      <p class="eyebrow small muted">Algebra · Grades 9–10</p>
      <h1 class="h1">Simplifying radicals</h1>
      <p class="lead">Simplify square roots, multiply them, and add or subtract like radicals.</p>
    </div>

    <section class="card panel" aria-label="Exercise">
      <p id="question" class="question" aria-live="polite"></p>
      <form id="form" novalidate autocomplete="off">
        <label for="answer" class="visually-hidden">Your answer</label>
        <div class="answer-row">
          <input id="answer" class="input" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="6√2" aria-describedby="hint error">
          <button id="action" class="btn" type="submit">Check</button>
        </div>
        <p id="hint" class="field-hint small muted">Type √ as sqrt, like 6sqrt2.</p>
        <p id="error" class="field-error" role="alert" hidden></p>
      </form>
      <div id="feedback" class="feedback" aria-live="polite"></div>
    </section>
  </main>

  <script src="../../assets/practice.js"></script>
  <script>
    (function (M) {
      M.practice({
        input: 'number',
        generate: function () {
          var free = [2, 3, 5, 6, 7, 10, 11, 13, 14, 15], r = M.pick(free), t = M.rand(1, 4), k, q, rows, ans;
          var rad = function (c, s) { return (c === 1 ? '' : c === -1 ? '−' : M.num(c)) + M.sqrt(s); };
          if (t === 1) {
            k = M.rand(2, 10); var big = k * k * r;
            q = M.sqrt(big);
            rows = [[q, '= ' + M.sqrt(k * k + ' × ' + r)], ['', '= ' + M.sqrt(k * k) + ' × ' + M.sqrt(r)], ['', '= <strong>' + rad(k, r) + '</strong>']];
            return { prompt: 'Simplify.', question: q, answer: k + '√' + r, sample: k + 'sqrt' + r, check: M.radicalCheck(k, r), display: rad(k, r), solution: M.steps(rows) + M.note('Find the largest perfect square factor of ' + big + ', which is ' + k * k + '.') };
          }
          if (t === 2) {
            var s = M.rand(1, 4), u = M.rand(1, 5); if (s === u) u++;
            var a = r * s * s, b = r * u * u; ans = r * s * u;
            q = M.sqrt(a) + ' × ' + M.sqrt(b);
            rows = [[q, '= ' + M.sqrt(a + ' × ' + b)], ['', '= ' + M.sqrt(a * b)], ['', '= <strong>' + ans + '</strong>']];
            return { prompt: 'Simplify.', question: q, answer: ans + '', sample: String(ans), check: M.radicalCheck(ans, 1), display: String(ans), solution: M.steps(rows) };
          }
          if (t === 3) {
            var c1 = M.rand(2, 9), c2 = M.rand(1, 9), plus = Math.random() < .5;
            if (!plus && c1 === c2) c2 = c1 - 1;
            k = plus ? c1 + c2 : c1 - c2;
            q = rad(c1, r) + (plus ? ' + ' : ' − ') + rad(c2, r);
            rows = [[q, '= (' + c1 + (plus ? ' + ' : ' − ') + c2 + ')' + M.sqrt(r)], ['', '= <strong>' + rad(k, r) + '</strong>']];
            return { prompt: 'Simplify.', question: q, answer: k + '√' + r, sample: k + 'sqrt' + r, check: M.radicalCheck(k, r), display: rad(k, r), solution: M.steps(rows) + M.note('Like radicals combine the same way as like terms.') };
          }
          var k1 = M.rand(1, 5), k2 = M.rand(2, 6); if (k1 === k2) k2++;
          k = k1 + k2;
          q = M.sqrt(k1 * k1 * r) + ' + ' + M.sqrt(k2 * k2 * r);
          rows = [[q, '= ' + rad(k1, r) + ' + ' + rad(k2, r)], ['', '= <strong>' + rad(k, r) + '</strong>']];
          return { prompt: 'Simplify.', question: q, answer: k + '√' + r, sample: k + 'sqrt' + r, check: M.radicalCheck(k, r), display: rad(k, r), solution: M.steps(rows) + M.note('Simplify each root first, then combine.') };
        }
      });
    })(IterMath);
  </script>
</body>
</html>
