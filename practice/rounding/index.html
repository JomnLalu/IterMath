<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rounding practice · IterMath</title>
  <meta name="description" content="Round whole numbers to the nearest 10, 100 or 1,000, and decimals to a set place. Instant feedback and a worked solution for every miss.">
  <link rel="canonical" href="https://itermath.jomontolalu.com/practice/rounding/">
  <meta name="theme-color" content="#fafafa">
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="IterMath">
  <meta property="og:title" content="Rounding practice · IterMath">
  <meta property="og:description" content="Round whole numbers to the nearest 10, 100 or 1,000, and decimals to a set place. Instant feedback and a worked solution for every miss.">
  <meta property="og:url" content="https://itermath.jomontolalu.com/practice/rounding/">

<body>
  <header class="container container--narrow topbar">
    <a class="back" href="../../" aria-label="All modules"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg><img src="../../assets/itermath-logo.svg" alt="" width="104" height="37"></a>
  </header>

  <main class="container container--narrow">
    <div class="practice-header">
      <p class="eyebrow small muted">Number sense · Grades 3–5</p>
      <h1 class="h1">Rounding</h1>
      <p class="lead">Round whole numbers to the nearest 10, 100 or 1,000, and decimals to a set place.</p>
    </div>

    <section class="card panel" aria-label="Exercise">
      <p id="question" class="question" aria-live="polite"></p>
      <form id="form" novalidate autocomplete="off">
        <label for="answer" class="visually-hidden">Your answer</label>
        <div class="answer-row">
          <input id="answer" class="input" type="text" inputmode="decimal" enterkeyhint="done" placeholder="Answer" aria-describedby="hint error">
          <button id="action" class="btn" type="submit">Check</button>
        </div>
        <p id="hint" class="field-hint small muted" hidden></p>
        <p id="error" class="field-error" role="alert" hidden></p>
      </form>
      <div id="feedback" class="feedback" aria-live="polite"></div>
    </section>
  </main>

  <script src="../../assets/practice.js"></script>
  <script>
    (function (M) {
      M.practice({
        input: 'number',
        generate: function () {
          var fmt = function (x) { return x.toLocaleString('en-US'); };
          if (Math.random() < .55) {
            var nn = M.rand(101, 99999);
            var u = M.pick([10, 100, 1000].filter(function (x) { return x < nn; }));
            var names = { 10: 'ten', 100: 'hundred', 1000: 'thousand' };
            var lo = Math.floor(nn / u) * u, hi = lo + u, d = Math.floor((nn % u) / (u / 10)), ans = d >= 5 ? hi : lo;
            return {
              prompt: 'Round to the nearest ' + names[u] + '.',
              question: fmt(nn),
              ask: '≈ <span class="muted">?</span>',
              answer: ans,
              display: fmt(ans),
              solution: M.steps([[fmt(nn), 'is between ' + fmt(lo) + ' and ' + fmt(hi)]]) +
                M.note('The digit to the right of the ' + names[u] + 's place is ' + d + '. ' +
                  (d >= 5 ? 'It is 5 or more, so round up' : 'It is less than 5, so round down') + ' to <strong>' + fmt(ans) + '</strong>.')
            };
          }
          var p = M.rand(0, 2), extra = M.rand(1, 2), tdp = p + extra;
          var k = M.rand(Math.pow(10, tdp), 99 * Math.pow(10, tdp));
          if (k % 10 === 0) k += M.rand(1, 9);
          var x = (k / Math.pow(10, tdp)).toFixed(tdp);
          var loI = Math.floor(k / Math.pow(10, extra)), dd = Math.floor(k / Math.pow(10, extra - 1)) % 10;
          var ansI = dd >= 5 ? loI + 1 : loI, f = Math.pow(10, p);
          var lo2 = (loI / f).toFixed(p), hi2 = ((loI + 1) / f).toFixed(p), ans2 = ansI / f;
          var target = ['whole number', 'tenth', 'hundredth'][p], place = ['ones', 'tenths', 'hundredths'][p];
          return {
            prompt: 'Round to the nearest ' + target + '.',
            question: x,
            ask: '≈ <span class="muted">?</span>',
            answer: ans2,
            display: ans2.toFixed(p),
            solution: M.steps([[x, 'is between ' + lo2 + ' and ' + hi2]]) +
              M.note('The digit to the right of the ' + place + ' place is ' + dd + '. ' +
                (dd >= 5 ? 'It is 5 or more, so round up' : 'It is less than 5, so round down') + ' to <strong>' + ans2.toFixed(p) + '</strong>.')
          };
        }
      });
    })(IterMath);
  </script>
</body>
</html>
