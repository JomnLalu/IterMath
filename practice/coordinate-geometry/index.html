<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Coordinate geometry practice · IterMath</title>
  <meta name="description" content="Find the distance, midpoint and slope between two points. Instant feedback and a worked solution for every miss.">
  <link rel="canonical" href="https://itermath.jomontolalu.com/practice/coordinate-geometry/">
  <meta name="theme-color" content="#fafafa">
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="IterMath">
  <meta property="og:title" content="Coordinate geometry practice · IterMath">
  <meta property="og:description" content="Find the distance, midpoint and slope between two points. Instant feedback and a worked solution for every miss.">
  <meta property="og:url" content="https://itermath.jomontolalu.com/practice/coordinate-geometry/">
  <meta property="og:image" content="https://itermath.jomontolalu.com/assets/og.png">

</head>
<body>
  <header class="container container--narrow topbar">
    <a class="back" href="../../" aria-label="All modules"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg><img src="../../assets/itermath-logo.svg" alt="" width="104" height="37"></a>
  </header>

  <main class="container container--narrow">
    <div class="practice-header">
      <p class="eyebrow small muted">Geometry and measurement · Grades 6–10</p>
      <h1 class="h1">Coordinate geometry</h1>
      <p class="lead">Find the distance, midpoint and slope between two points.</p>
    </div>

    <section class="card panel" aria-label="Exercise">
      <p id="question" class="question" aria-live="polite"></p>
      <form id="form" novalidate autocomplete="off">
        <label for="answer" class="visually-hidden">Your answer</label>
        <div class="answer-row">
          <input id="answer" class="input" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="Answer" aria-describedby="hint error">
          <button id="action" class="btn" type="submit">Check</button>
        </div>
        <p id="hint" class="field-hint small muted" hidden></p>
        <p id="error" class="field-error" role="alert" hidden></p>
      </form>
      <div id="feedback" class="feedback" aria-live="polite"></div>
    </section>
  </main>

  <script src="../../assets/practice.js"></script>
  <script>
    (function (M) {
      M.practice({
        input: 'number',
        generate: function () {
          var n = M.num, pt = function (x, y) { return '(' + n(x) + ', ' + n(y) + ')'; }, t = M.rand(1, 3);
          var x1 = M.rand(-8, 8), y1 = M.rand(-8, 8), x2, y2;
          if (t === 1) {
            var tr = M.pick([[3, 4, 5], [6, 8, 10], [5, 12, 13], [8, 15, 17], [9, 12, 15]]);
            var dx = tr[0] * M.pick([1, -1]), dy = tr[1] * M.pick([1, -1]);
            if (Math.random() < .5) { var s = dx; dx = dy; dy = s; }
            x2 = x1 + dx; y2 = y1 + dy;
            return {
              prompt: 'Find the distance between the points.', question: pt(x1, y1) + ' and ' + pt(x2, y2), ask: false, answer: tr[2], hint: '',
              solution: M.steps([['<i>d</i>', '= ' + M.sqrt('(' + n(x2) + ' − ' + M.operand(x1) + ')<sup>2</sup> + (' + n(y2) + ' − ' + M.operand(y1) + ')<sup>2</sup>')], ['', '= ' + M.sqrt(M.pow(M.operand(dx), 2) + ' + ' + M.pow(M.operand(dy), 2))], ['', '= ' + M.sqrt(dx * dx + dy * dy) + ' = <strong>' + tr[2] + '</strong>']])
            };
          }
          x2 = M.rand(-8, 8); y2 = M.rand(-8, 8);
          if (t === 2) {
            var mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
            return {
              prompt: 'Find the midpoint.', question: pt(x1, y1) + ' and ' + pt(x2, y2), ask: false, answer: [mx, my], ordered: true,
              placeholder: 'x, y', hint: 'Enter x and y separated by a comma.',
              solution: M.steps([['<i>x</i>', '= ' + M.frac(n(x1) + ' + ' + M.operand(x2), 2) + ' = ' + n(mx)], ['<i>y</i>', '= ' + M.frac(n(y1) + ' + ' + M.operand(y2), 2) + ' = ' + n(my)], ['midpoint', '= <strong>' + pt(mx, my) + '</strong>']])
            };
          }
          while (x2 === x1) x2 = M.rand(-8, 8);
          var m = M.Q(y2 - y1, x2 - x1);
          return {
            prompt: 'Find the slope of the line through the points.', question: pt(x1, y1) + ' and ' + pt(x2, y2), ask: false, answer: m,
            hint: 'Fractions are fine, like −2/3.',
            solution: M.steps([['<i>m</i>', '= ' + M.frac('<i>y</i><sub>2</sub> − <i>y</i><sub>1</sub>', '<i>x</i><sub>2</sub> − <i>x</i><sub>1</sub>')], ['', '= ' + M.frac(n(y2) + ' − ' + M.operand(y1), n(x2) + ' − ' + M.operand(x1))], ['', '= ' + M.frac(n(y2 - y1), n(x2 - x1))], ['', '= <strong>' + M.q(m) + '</strong>']])
          };
        }
      });
    })(IterMath);
  </script>
</body>
</html>
