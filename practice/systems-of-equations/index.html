<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Systems of equations practice · IterMath</title>
  <meta name="description" content="Solve a pair of linear equations in x and y. Instant feedback and a worked solution for every miss.">
  <link rel="canonical" href="https://itermath.jomontolalu.com/practice/systems-of-equations/">
  <meta name="theme-color" content="#fafafa">
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="IterMath">
  <meta property="og:title" content="Systems of equations practice · IterMath">
  <meta property="og:description" content="Solve a pair of linear equations in x and y. Instant feedback and a worked solution for every miss.">
  <meta property="og:url" content="https://itermath.jomontolalu.com/practice/systems-of-equations/">
  <meta property="og:image" content="https://itermath.jomontolalu.com/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

</head>
<body>
  <header class="container container--narrow topbar">
    <a class="back" href="../../" aria-label="All modules"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg><img src="../../assets/itermath-logo.svg" alt="" width="104" height="37"></a>
  </header>

  <main class="container container--narrow">
    <div class="practice-header">
      <p class="eyebrow small muted">Algebra · Grades 8–9</p>
      <h1 class="h1">Systems of equations</h1>
      <p class="lead">Solve a pair of linear equations in x and y.</p>
    </div>

    <section class="card panel" aria-label="Exercise">
      <p id="question" class="question" aria-live="polite"></p>
      <form id="form" novalidate autocomplete="off">
        <label for="answer" class="visually-hidden">Your answer</label>
        <div class="answer-row">
          <input id="answer" class="input" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="x, y" aria-describedby="hint error">
          <button id="action" class="btn" type="submit">Check</button>
        </div>
        <p id="hint" class="field-hint small muted">Enter x and y separated by a comma, like 3, −2.</p>
        <p id="error" class="field-error" role="alert" hidden></p>
      </form>
      <div id="feedback" class="feedback" aria-live="polite"></div>
    </section>
  </main>

  <script src="../../assets/practice.js"></script>
  <script>
    (function (M) {
      M.practice({
        input: 'number',
        generate: function () {
          var n = M.num, x = M.v('x'), y = M.v('y'), a1, b1, a2, b2;
          do { a1 = M.randNZ(-6, 6); b1 = M.randNZ(-6, 6); a2 = M.randNZ(-6, 6); b2 = M.randNZ(-6, 6); } while (a1 * b2 - a2 * b1 === 0);
          var xs = M.rand(-9, 9), ys = M.rand(-9, 9), c1 = a1 * xs + b1 * ys, c2 = a2 * xs + b2 * ys;
          var eq = function (a, b, c) { return M.terms([[a, x], [b, y]]) + ' = ' + n(c); };
          var D = a1 * b2 - a2 * b1, R = c1 * b2 - c2 * b1;
          var rows = [
            ['(1) × ' + M.operand(b2), eq(a1 * b2, b1 * b2, c1 * b2)],
            ['(2) × ' + M.operand(b1), eq(a2 * b1, b1 * b2, c2 * b1)],
            ['subtract', M.terms([[D, x]]) + ' = ' + n(R)],
            ['', x + ' = <strong>' + n(xs) + '</strong>'],
            ['into (1)', M.terms([[b1, y]]) + ' = ' + n(c1) + ' − ' + M.operand(a1 * xs) + ' = ' + n(c1 - a1 * xs)],
            ['', y + ' = <strong>' + n(ys) + '</strong>']
          ];
          return {
            prompt: 'Solve for ' + x + ' and ' + y + '.',
            question: '<span class="system"><span>' + eq(a1, b1, c1) + '</span><span>' + eq(a2, b2, c2) + '</span></span>', ask: false,
            answer: [xs, ys], ordered: true,
            solution: M.steps(rows) + M.note('Multiply so the ' + y + ' terms match, subtract to eliminate ' + y + ', then substitute back.')
          };
        }
      });
    })(IterMath);
  </script>
</body>
</html>
