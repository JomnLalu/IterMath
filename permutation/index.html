<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Practice - Permutations</title>
    <!-- Load MathJax for LaTeX rendering -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f4f9;
            margin: 0;
            color: #333;
        }
        .container {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        /* --- NEW: Logo Styling --- */
        .app-logo-wrapper {
            margin: 0 auto 1.5rem auto; /* Centered with bottom margin to separate from title */
            text-align: center;
            width: 80%; /* Takes up 80% of its parent's width */
            max-width: 250px; /* But won't exceed 250px wide on larger screens */
        }
        .app-logo {
            max-width: 100%; /* Important: prevents the image from overflowing its wrapper */
            height: auto; /* Maintains original aspect ratio */
        }
        /* ------------------------- */

        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            color: #2c3e50;
        }
        .math-q {
            font-size: 1.5rem;
            margin: 2rem 0;
        }
        .input-group {
            margin-bottom: 1.5rem;
        }
        input[type="number"] {
            padding: 0.6rem;
            font-size: 1rem;
            width: 120px;
            border: 2px solid #ddd;
            border-radius: 6px;
            outline: none;
            text-align: center;
            transition: border-color 0.2s;
        }
        input[type="number"]:focus {
            border-color: #007bff;
        }
        button {
            padding: 0.6rem 1.2rem;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background-color: #007bff;
            color: white;
            font-weight: bold;
            transition: background 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:active {
            transform: scale(0.98);
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        #next-btn {
            background-color: #28a745;
            margin-top: 1.5rem;
            width: 100%;
        }
        #next-btn:hover {
            background-color: #218838;
        }
        .feedback {
            min-height: 60px;
        }
        .correct {
            color: #28a745;
            font-weight: bold;
            font-size: 1.1rem;
            padding: 1rem;
            background: #e8f5e9;
            border-radius: 6px;
            animation: fadeIn 0.3s ease-in;
        }
        .incorrect-container {
            text-align: left;
            background: #fffafa;
            padding: 1.5rem;
            border-left: 4px solid #dc3545;
            border-radius: 6px;
            margin-top: 1rem;
            animation: fadeIn 0.3s ease-in;
            overflow-x: auto;
        }
        .incorrect-title {
            color: #dc3545;
            font-weight: bold;
            margin-top: 0;
            margin-bottom: 1rem;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- --- NEW: Logo HTML --- -->
    <!-- MathReps Logo -->
    <div class="app-logo-wrapper">
        <img src="\assets\mathreps-logo.svg" alt="MathReps Logo" class="app-logo">
    </div>
    <!-- ----------------------- -->

    <h1>Permutation Exercise</h1>
    <div id="question-container" class="math-q"></div>
    
    <div class="input-group">
        <input type="number" id="answer-input" placeholder="Value" autocomplete="off" />
        <button id="submit-btn" onclick="checkAnswer()">Submit</button>
    </div>
    
    <div id="feedback-container" class="feedback"></div>
    <button id="next-btn" onclick="generateQuestion()" style="display:none;">Next Question</button>
</div>

<script>
    let currentN, currentK, currentAns;

    // Helper function to calculate factorial
    function factorial(num) {
        if (num <= 1) return 1;
        return num * factorial(num - 1);
    }

    // Initialize and generate the first question
    function generateQuestion() {
        // Reset UI state
        document.getElementById('feedback-container').innerHTML = '';
        const input = document.getElementById('answer-input');
        input.value = '';
        input.disabled = false;
        document.getElementById('submit-btn').style.display = 'inline-block';
        document.getElementById('next-btn').style.display = 'none';
        
        // Focus the input field automatically
        input.focus();

        // Generate N (between 3 and 8 to keep factorials manageable)
        currentN = Math.floor(Math.random() * 6) + 3; 
        // Generate K (between 1 and N)
        currentK = Math.floor(Math.random() * currentN) + 1; 
        
        // Calculate the correct answer: P(n,k) = n! / (n-k)!
        currentAns = factorial(currentN) / factorial(currentN - currentK);

        // Display question using LaTeX notation
        const qHTML = `$$ P(${currentN}, ${currentK}) = \\text{?} $$`;
        document.getElementById('question-container').innerHTML = qHTML;
        
        // Re-render MathJax
        if (window.MathJax) {
            MathJax.typesetPromise();
        }
    }

    // Check user input against the calculated answer
    function checkAnswer() {
        const inputElement = document.getElementById('answer-input');
        const userAns = parseInt(inputElement.value);
        const feedback = document.getElementById('feedback-container');

        // Input validation
        if (isNaN(userAns)) {
            alert("Please enter a valid number.");
            return;
        }

        // Disable input and hide submit button to prevent double submissions
        inputElement.disabled = true;
        document.getElementById('submit-btn').style.display = 'none';

        if (userAns === currentAns) {
            // Correct Answer Sequence
            feedback.innerHTML = `
                <div class="correct">
                    Correct! Great job. <br>
                    <span style="font-size: 0.9em; color: #555;">Loading next question...</span>
                </div>`;
            
            // Wait 0.5 seconds, then automatically generate the next question
            setTimeout(generateQuestion, 500);
            
        } else {
            // Incorrect Answer Sequence
            const diff = currentN - currentK;
            
            // Build the LaTeX step-by-step solution
            let steps = `<div class="incorrect-container">`;
            steps += `<p class="incorrect-title">Incorrect. Here is the step-by-step solution:</p>`;
            
            steps += `$$ \\begin{aligned} `;
            steps += `P(n, k) &= \\frac{n!}{(n-k)!} \\\\[8pt]`;
            steps += `P(${currentN}, ${currentK}) &= \\frac{${currentN}!}{(${currentN} - ${currentK})!} \\\\[8pt]`;
            steps += `&= \\frac{${currentN}!}{${diff}!} \\\\[8pt]`;
            
            // Add factorial expansion visualization
            if (currentK > 0 && currentN !== diff) {
                let expansion = [];
                for(let i = currentN; i > diff; i--) {
                    expansion.push(i);
                }
                steps += `&= ${expansion.join(' \\times ')} \\\\[8pt]`;
            }
            
            steps += `&= \\mathbf{${currentAns}}`;
            steps += `\\end{aligned} $$`;
            steps += `</div>`;

            feedback.innerHTML = steps;
            
            // Show manual next button
            document.getElementById('next-btn').style.display = 'inline-block';
            
            // Re-render MathJax for the newly injected LaTeX
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }
    }

    // Allow pressing "Enter" key inside the input field to trigger submission
    document.getElementById('answer-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            checkAnswer();
        }
    });

    // Run once on load
    window.onload = generateQuestion;
</script>

</body>
</html>
