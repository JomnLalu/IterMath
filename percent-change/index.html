<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Percent change, discount and tax practice · IterMath</title>
  <meta name="description" content="Percent increase and decrease, sale prices, sales tax and tips. Instant feedback and a worked solution for every miss.">
  <link rel="canonical" href="https://itermath.jomontolalu.com/percent-change">
  <meta name="theme-color" content="#fafafa">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="IterMath">
  <meta property="og:title" content="Percent change, discount and tax practice · IterMath">
  <meta property="og:description" content="Percent increase and decrease, sale prices, sales tax and tips. Instant feedback and a worked solution for every miss.">
  <meta property="og:url" content="https://itermath.jomontolalu.com/percent-change">
  <meta property="og:image" content="https://itermath.jomontolalu.com/assets/og.png">

</head>
<body>
  <header class="container container--narrow topbar">
    <a class="back" href="/" aria-label="All modules"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg><img src="/assets/itermath-logo.svg" alt="" width="104" height="37"></a>
  </header>

  <main class="container container--narrow">
    <div class="practice-header">
      <p class="eyebrow small muted">Ratios and percents · Grades 7–8</p>
      <h1 class="h1">Percent change, discount and tax</h1>
      <p class="lead">Percent increase and decrease, sale prices, sales tax and tips.</p>
    </div>

    <section class="card panel" aria-label="Exercise">
      <p id="question" class="question" aria-live="polite"></p>
      <form id="form" novalidate autocomplete="off">
        <label for="answer" class="visually-hidden">Your answer</label>
        <div class="answer-row">
          <input id="answer" class="input" type="text" inputmode="decimal" enterkeyhint="done" placeholder="Answer" aria-describedby="hint error">
          <button id="action" class="btn" type="submit">Check</button>
        </div>
        <p id="hint" class="field-hint small muted" hidden></p>
        <p id="error" class="field-error" role="alert" hidden></p>
      </form>
      <div id="feedback" class="feedback" aria-live="polite"></div>
    </section>
  </main>

  <script src="/assets/practice.js"></script>
  <script>
    (function (M) {
      M.practice({
        input: 'number',
        generate: function () {
          var n = M.num, t = M.rand(1, 5), money = function (x) { return '$' + x.toFixed(2); };
          var p = M.pick([5, 10, 15, 20, 25, 30, 40, 50, 60, 75]);
          if (t <= 2) {
            var up = t === 1, o = M.rand(2, 20) * 20, ch = o * p / 100, nw = up ? o + ch : o - ch;
            return {
              prompt: 'Find the percent ' + (up ? 'increase' : 'decrease') + '.', question: o + ' → ' + nw, ask: '= <span class="muted">?</span>%', answer: p, display: p + '%',
              solution: M.steps([['change', '= ' + (up ? nw + ' − ' + o : o + ' − ' + nw) + ' = ' + ch], ['percent', '= ' + M.frac(ch, o) + ' × 100%'], ['', '= <strong>' + p + '%</strong>']]) +
                M.note('Always divide by the original amount.')
            };
          }
          var price = M.rand(4, 60) * 5;
          if (t === 3) {
            var off = price * p / 100, sale = price - off;
            return {
              prompt: 'A ' + money(price) + ' jacket is ' + p + '% off.', question: 'Sale price', ask: '= $<span class="muted">?</span>', answer: sale, display: money(sale),
              solution: M.steps([['discount', '= ' + p + '% × ' + money(price) + ' = ' + money(off)], ['sale price', '= ' + money(price) + ' − ' + money(off)], ['', '= <strong>' + money(sale) + '</strong>']])
            };
          }
          var r = M.pick([5, 6, 8, 10]), tip = M.pick([15, 18, 20]);
          var rate = t === 4 ? r : tip, extra = price * rate / 100, total = price + extra;
          return {
            prompt: t === 4 ? 'A ' + money(price) + ' item has ' + rate + '% sales tax.' : 'A ' + money(price) + ' meal gets a ' + rate + '% tip.',
            question: 'Total', ask: '= $<span class="muted">?</span>', answer: total, display: money(total), places: 2,
            solution: M.steps([[t === 4 ? 'tax' : 'tip', '= ' + rate + '% × ' + money(price) + ' = ' + money(extra)], ['total', '= ' + money(price) + ' + ' + money(extra)], ['', '= <strong>' + money(total) + '</strong>']])
          };
        }
      });
    })(IterMath);
  </script>
</body>
</html>
