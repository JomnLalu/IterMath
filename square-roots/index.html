<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Square and cube roots practice · IterMath</title>
  <meta name="description" content="Find square roots of perfect squares and cube roots of perfect cubes. Instant feedback and a worked solution for every miss.">
  <link rel="canonical" href="https://itermath.jomontolalu.com/square-roots">
  <meta name="theme-color" content="#fafafa">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="IterMath">
  <meta property="og:title" content="Square and cube roots practice · IterMath">
  <meta property="og:description" content="Find square roots of perfect squares and cube roots of perfect cubes. Instant feedback and a worked solution for every miss.">
  <meta property="og:url" content="https://itermath.jomontolalu.com/square-roots">
  <meta property="og:image" content="https://itermath.jomontolalu.com/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="container container--narrow topbar">
    <a class="back" href="/" aria-label="All modules"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg><img src="/assets/itermath-logo.svg" alt="" width="104" height="37"></a>
  </header>

  <main class="container container--narrow">
    <div class="practice-header">
      <p class="eyebrow small muted">Integers, powers and factors · Grades 6–8</p>
      <h1 class="h1">Square and cube roots</h1>
      <p class="lead">Find square roots of perfect squares and cube roots of perfect cubes.</p>
    </div>

    <section class="card panel" aria-label="Exercise">
      <p id="question" class="question" aria-live="polite"></p>
      <form id="form" novalidate autocomplete="off">
        <label for="answer" class="visually-hidden">Your answer</label>
        <div class="answer-row">
          <input id="answer" class="input" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="Answer" aria-describedby="hint error">
          <button id="action" class="btn" type="submit">Check</button>
        </div>
        <p id="hint" class="field-hint small muted">Fractions are fine, like 3/4.</p>
        <p id="error" class="field-error" role="alert" hidden></p>
      </form>
      <div id="feedback" class="feedback" aria-live="polite"></div>
    </section>
  </main>

  <script src="/assets/practice.js"></script>
  <script>
    (function (M) {
      M.practice({
        input: 'number',
        generate: function () {
          var t = Math.random(), r;
          if (t < .6) {
            r = M.rand(2, 20);
            return {
              question: M.sqrt(r * r), answer: r,
              solution: M.steps([[r + ' × ' + r, '= ' + r * r], [M.sqrt(r * r), '= <strong>' + r + '</strong>']])
            };
          }
          if (t < .85) {
            r = M.rand(2, 10) * (Math.random() < .25 ? -1 : 1);
            var c = r * r * r;
            return {
              question: M.sqrt(M.num(c), 3), answer: r,
              solution: M.steps([[M.operand(r) + ' × ' + M.operand(r) + ' × ' + M.operand(r), '= ' + M.num(c)], [M.sqrt(M.num(c), 3), '= <strong>' + M.num(r) + '</strong>']]) +
                (r < 0 ? M.note('A negative number has a negative cube root.') : '')
            };
          }
          var a = M.rand(1, 11), b = M.rand(a + 1, 12);
          while (M.gcd(a, b) !== 1) b++;
          return {
            question: M.sqrt(M.frac(a * a, b * b)), answer: M.Q(a, b),
            solution: M.steps([[M.sqrt(M.frac(a * a, b * b)), '= ' + M.frac(M.sqrt(a * a), M.sqrt(b * b))], ['', '= <strong>' + M.frac(a, b) + '</strong>']])
          };
        }
      });
    })(IterMath);
  </script>
</body>
</html>
