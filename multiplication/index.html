<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplication Practice | IterMath</title>
    <meta name="description" content="Practice times tables from 2 to 12, one question at a time.">
    <link rel="canonical" href="https://itermath.jomontolalu.com/multiplication/">
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="IterMath">
    <meta property="og:title" content="Multiplication Practice | IterMath">
    <meta property="og:description" content="Practice times tables from 2 to 12, one question at a time.">
    <meta property="og:url" content="https://itermath.jomontolalu.com/multiplication/">
    <meta property="og:image" content="https://itermath.jomontolalu.com/assets/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="/assets/style.css">
    <script>
        // Reveal questions only after MathJax has typeset them
        window.MathJax = {
            startup: {
                pageReady: () => MathJax.startup.defaultPageReady().then(() => document.documentElement.classList.add('math-ready'))
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" onerror="document.documentElement.classList.add('math-ready')"></script>
</head>
<body>

<main class="exercise">
    <a href="/" class="exercise-logo" aria-label="IterMath home">
        <img src="/assets/itermath-logo.svg" alt="IterMath" width="160" height="57">
    </a>

    <h1>Multiplication</h1>
    <div id="question-container" class="math-q"></div>
    
    <div class="input-group">
        <label for="answer-input" class="visually-hidden">Your answer</label>
        <input type="number" id="answer-input" class="input" placeholder="Answer" autocomplete="off" inputmode="numeric" />
        <button id="submit-btn" class="button" onclick="checkAnswer()">Submit</button>
    </div>
    
    <div id="feedback-container" class="feedback" aria-live="polite"></div>
    <button id="next-btn" class="button button-secondary" onclick="generateQuestion()" style="display:none;">Next Question</button>

    <a href="/" class="back-link">&larr; All modules</a>
</main>

<script>
    let currentA, currentB, currentAns;

    // Initialize and generate the first question
    function generateQuestion() {
        // Reset UI state
        document.getElementById('feedback-container').innerHTML = '';
        const input = document.getElementById('answer-input');
        input.value = '';
        input.disabled = false;
        document.getElementById('submit-btn').style.display = 'inline-block';
        document.getElementById('next-btn').style.display = 'none';
        
        // Focus the input field automatically
        input.focus();

        // Generate random numbers for multiplication (e.g., between 2 and 12 for standard times tables)
        currentA = Math.floor(Math.random() * 11) + 2; 
        currentB = Math.floor(Math.random() * 11) + 2; 
        
        // Calculate the correct answer
        currentAns = currentA * currentB;

        // Display question using LaTeX notation (\times for multiplication symbol)
        const qHTML = `$$ ${currentA} \\times ${currentB} = \\text{?} $$`;
        document.getElementById('question-container').innerHTML = qHTML;
        
        // Re-render MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise();
        }
    }

    // Check user input against the calculated answer
    function checkAnswer() {
        const inputElement = document.getElementById('answer-input');
        const userAns = parseInt(inputElement.value);
        const feedback = document.getElementById('feedback-container');

        // Input validation
        if (isNaN(userAns)) {
            feedback.innerHTML = `<p class="hint">Enter a number to check your answer.</p>`;
            inputElement.focus();
            return;
        }

        // Disable input and hide submit button to prevent double submissions
        inputElement.disabled = true;
        document.getElementById('submit-btn').style.display = 'none';

        if (userAns === currentAns) {
            // Correct Answer Sequence
            feedback.innerHTML = `
                <div class="correct">
                    Correct!
                    <span class="feedback-note">Loading next question...</span>
                </div>`;
            
            // Wait 0.5 seconds, then automatically generate the next question
            setTimeout(generateQuestion, 500);
            
        } else {
            // Incorrect Answer Sequence
            
            // Build the LaTeX visual solution for multiplication (Vertical alignment)
            let steps = `<div class="incorrect-container">`;
            steps += `<p class="incorrect-title">Incorrect. Here is the solution:</p>`;
            
            steps += `$$ \\begin{array}{r} `;
            steps += `${currentA} \\\\[2pt]`;
            steps += `\\times \\; ${currentB} \\\\[2pt]`;
            steps += `\\hline \\\\[-8pt]`;
            steps += `\\mathbf{${currentAns}}`;
            steps += `\\end{array} $$`;
            steps += `</div>`;

            feedback.innerHTML = steps;
            
            // Show manual next button
            document.getElementById('next-btn').style.display = 'inline-block';
            
            // Re-render MathJax for the newly injected LaTeX
            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise();
            }
        }
    }

    // Allow pressing "Enter" key inside the input field to trigger submission
    document.getElementById('answer-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            checkAnswer();
        }
    });

    // Run once on load
    window.onload = generateQuestion;
</script>

</body>
</html>
