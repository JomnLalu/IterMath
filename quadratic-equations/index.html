<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Quadratic equations practice · IterMath</title>
  <meta name="description" content="Solve quadratic equations by factoring, by taking square roots and with the quadratic formula. Instant feedback and a worked solution for every miss.">
  <link rel="canonical" href="https://itermath.jomontolalu.com/quadratic-equations">
  <meta name="theme-color" content="#fafafa">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="IterMath">
  <meta property="og:title" content="Quadratic equations practice · IterMath">
  <meta property="og:description" content="Solve quadratic equations by factoring, by taking square roots and with the quadratic formula. Instant feedback and a worked solution for every miss.">
  <meta property="og:url" content="https://itermath.jomontolalu.com/quadratic-equations">
  <meta property="og:image" content="https://itermath.jomontolalu.com/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="container container--narrow topbar">
    <a class="back" href="/" aria-label="All modules"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg><img src="/assets/itermath-logo.svg" alt="" width="104" height="37"></a>
  </header>

  <main class="container container--narrow">
    <div class="practice-header">
      <p class="eyebrow small muted">Algebra · Grades 9–10</p>
      <h1 class="h1">Quadratic equations</h1>
      <p class="lead">Solve quadratic equations by factoring, by taking square roots and with the quadratic formula.</p>
    </div>

    <section class="card panel" aria-label="Exercise">
      <p id="question" class="question" aria-live="polite"></p>
      <form id="form" novalidate autocomplete="off">
        <label for="answer" class="visually-hidden">Your answer</label>
        <div class="answer-row">
          <input id="answer" class="input" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="x = ?, ?" aria-describedby="hint error">
          <button id="action" class="btn" type="submit">Check</button>
        </div>
        <p id="hint" class="field-hint small muted">Enter both solutions separated by a comma, like 3, −5.</p>
        <p id="error" class="field-error" role="alert" hidden></p>
      </form>
      <div id="feedback" class="feedback" aria-live="polite"></div>
    </section>
  </main>

  <script src="/assets/practice.js"></script>
  <script>
    (function (M) {
      M.practice({
        input: 'number',
        generate: function () {
          var n = M.num, P = M.poly, x = M.v('x'), t = M.rand(1, 4), eq, ans, rows, note, places;
          if (t === 1) {
            var r1, r2; do { r1 = M.rand(-9, 9); r2 = M.rand(-9, 9); } while (r1 === r2);
            eq = P([1, -(r1 + r2), r1 * r2]) + ' = 0'; ans = [r1, r2];
            rows = [['(' + P([1, -r1]) + ')(' + P([1, -r2]) + ')', '= 0'], [x, '= <strong>' + n(r1) + '</strong> or <strong>' + n(r2) + '</strong>']];
            note = 'Factor, then set each bracket equal to zero.';
          } else if (t === 2) {
            var r = M.rand(1, 12), k = M.rand(1, 3);
            eq = (k === 1 ? '' : k) + M.pow(x, 2) + ' = ' + k * r * r; ans = [r, -r];
            rows = [[M.pow(x, 2), '= ' + r * r], [x, '= ±' + M.sqrt(r * r) + ' = <strong>±' + r + '</strong>']];
            note = 'Taking a square root gives a positive and a negative solution.';
          } else if (t === 3) {
            var a = M.rand(2, 3), p, q;
            do { p = M.randNZ(-7, 7); q = M.randNZ(-6, 6); } while (M.gcd(a, p) !== 1);
            eq = P([a, a * q + p, p * q]) + ' = 0'; ans = [M.Q(-p, a), -q];
            rows = [['(' + P([a, p]) + ')(' + P([1, q]) + ')', '= 0'], [x, '= <strong>' + M.q(M.Q(-p, a)) + '</strong> or <strong>' + n(-q) + '</strong>']];
            note = 'Fractions and decimals are both fine, like ' + M.qtext(M.Q(-p, a)) + '.';
          } else {
            var b, c, D;
            do { b = M.rand(-9, 9); c = M.rand(-12, 8); D = b * b - 4 * c; } while (D <= 0 || Math.sqrt(D) === Math.round(Math.sqrt(D)));
            places = 2;
            var s1 = M.round((-b + Math.sqrt(D)) / 2, 2), s2 = M.round((-b - Math.sqrt(D)) / 2, 2);
            eq = P([1, b, c]) + ' = 0'; ans = [s1, s2];
            rows = [[x, '= ' + M.frac(n(-b) + ' ± ' + M.sqrt(M.pow(M.operand(b), 2) + ' − 4(1)(' + n(c) + ')'), '2(1)')], ['', '= ' + M.frac(n(-b) + ' ± ' + M.sqrt(D), 2)], ['', '≈ <strong>' + n(s1) + '</strong> or <strong>' + n(s2) + '</strong>']];
            note = 'Use ' + x + ' = ' + M.frac('−<i>b</i> ± ' + M.sqrt('<i>b</i><sup>2</sup> − 4<i>ac</i>'), '2<i>a</i>') + '. Round to 2 decimal places.';
          }
          return {
            prompt: 'Solve for ' + x + '.' + (places ? ' Round to 2 decimal places.' : ''), question: eq, ask: false,
            answer: ans, places: places, solution: M.steps(rows) + M.note(note)
          };
        }
      });
    })(IterMath);
  </script>
</body>
</html>
