<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Practice - Mixed Operations</title>
    <!-- Load MathJax for LaTeX rendering -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f4f9;
            margin: 0;
            color: #333;
        }
        .container {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 550px;
            width: 90%;
        }

        /* --- Logo Styling --- */
        .app-logo-wrapper {
            margin: 0 auto 1.5rem auto; 
            text-align: center;
            width: 80%; 
            max-width: 250px; 
        }
        .app-logo {
            max-width: 100%; 
            height: auto; 
        }
        /* ------------------------- */

        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            color: #2c3e50;
        }
        .math-q {
            font-size: 1.5rem;
            margin: 2rem 0;
        }
        .input-group {
            margin-bottom: 1.5rem;
        }
        input[type="number"] {
            padding: 0.6rem;
            font-size: 1rem;
            width: 140px;
            border: 2px solid #ddd;
            border-radius: 6px;
            outline: none;
            text-align: center;
            transition: border-color 0.2s;
        }
        input[type="number"]:focus {
            border-color: #007bff;
        }
        button {
            padding: 0.6rem 1.2rem;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background-color: #007bff;
            color: white;
            font-weight: bold;
            transition: background 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:active {
            transform: scale(0.98);
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        #next-btn {
            background-color: #28a745;
            margin-top: 1.5rem;
            width: 100%;
        }
        #next-btn:hover {
            background-color: #218838;
        }
        .feedback {
            min-height: 60px;
        }
        .correct {
            color: #28a745;
            font-weight: bold;
            font-size: 1.1rem;
            padding: 1rem;
            background: #e8f5e9;
            border-radius: 6px;
            animation: fadeIn 0.3s ease-in;
        }
        .incorrect-container {
            text-align: left;
            background: #fffafa;
            padding: 1.5rem;
            border-left: 4px solid #dc3545;
            border-radius: 6px;
            margin-top: 1rem;
            animation: fadeIn 0.3s ease-in;
            overflow-x: auto;
        }
        .incorrect-title {
            color: #dc3545;
            font-weight: bold;
            margin-top: 0;
            margin-bottom: 1rem;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="app-logo-wrapper">
        <img src="\assets\itermath-logo.svg" alt="IterMath Logo" class="app-logo">
    </div>
    <h1>Mixed Operations Practice</h1>
    <div id="question-container" class="math-q"></div>
    
    <div class="input-group">
        <input type="number" id="answer-input" placeholder="Value" autocomplete="off" />
        <button id="submit-btn" onclick="checkAnswer()">Submit</button>
    </div>
    
    <div id="feedback-container" class="feedback"></div>
    <button id="next-btn" onclick="generateQuestion()" style="display:none;">Next Question</button>
</div>

<script>
    let currentTex, currentAns;

    // Utility functions to generate random numbers and operators
    function getRandOp(ops) { 
        return ops[Math.floor(Math.random() * ops.length)]; 
    }
    
    function getRandNum(min, max) { 
        return Math.floor(Math.random() * (max - min + 1)) + min; 
    }

    // This function creates randomized expressions while ensuring clean integer math
    function generateExpressionData() {
        const templates = [
            // 1. (A +/- B) * C
            () => {
                let a = getRandNum(2, 15), b = getRandNum(2, 15), c = getRandNum(2, 9);
                let op = getRandOp(['+', '-']);
                let tex = `(${a} ${op} ${b}) \\times ${c}`;
                let ans = op === '+' ? (a + b) * c : (a - b) * c;
                return { tex, ans };
            },
            // 2. A * (B +/- C)
            () => {
                let a = getRandNum(2, 9), b = getRandNum(2, 15), c = getRandNum(2, 15);
                let op = getRandOp(['+', '-']);
                let tex = `${a} \\times (${b} ${op} ${c})`;
                let ans = op === '+' ? a * (b + c) : a * (b - c);
                return { tex, ans };
            },
            // 3. (A +/- B) / C  [Ensures clean division]
            () => {
                let c = getRandNum(2, 10);
                let divResult = getRandNum(2, 12);
                let target = c * divResult; // Target is the total value inside parentheses
                let op = getRandOp(['+', '-']);
                let a, b;
                
                if (op === '+') {
                    a = getRandNum(1, target - 1);
                    b = target - a;
                } else {
                    b = getRandNum(1, 20);
                    a = target + b;
                }
                
                let tex = `(${a} ${op} ${b}) \\div ${c}`;
                return { tex, ans: divResult };
            },
            // 4. A / B +/- C * D [Ensures clean division]
            () => {
                let b = getRandNum(2, 10);
                let divResult = getRandNum(2, 10);
                let a = b * divResult;
                let c = getRandNum(2, 9), d = getRandNum(2, 9);
                let op = getRandOp(['+', '-']);
                let tex = `${a} \\div ${b} ${op} ${c} \\times ${d}`;
                let ans = op === '+' ? divResult + (c * d) : divResult - (c * d);
                return { tex, ans };
            },
            // 5. (A +/- B) * (C +/- D)
            () => {
                let a = getRandNum(1, 10), b = getRandNum(1, 10);
                let c = getRandNum(1, 10), d = getRandNum(1, 10);
                let op1 = getRandOp(['+', '-']), op2 = getRandOp(['+', '-']);
                let tex = `(${a} ${op1} ${b}) \\times (${c} ${op2} ${d})`;
                let val1 = op1 === '+' ? a + b : a - b;
                let val2 = op2 === '+' ? c + d : c - d;
                return { tex, ans: val1 * val2 };
            },
            // 6. A +/- B * C +/- D
            () => {
                let a = getRandNum(10, 30), b = getRandNum(2, 9), c = getRandNum(2, 9), d = getRandNum(1, 20);
                let op1 = getRandOp(['+', '-']), op2 = getRandOp(['+', '-']);
                let tex = `${a} ${op1} ${b} \\times ${c} ${op2} ${d}`;
                let valMult = b * c;
                let step1 = op1 === '+' ? a + valMult : a - valMult;
                let ans = op2 === '+' ? step1 + d : step1 - d;
                return { tex, ans };
            }
        ];

        // Randomly select one of the templates and generate the question
        let generator = templates[Math.floor(Math.random() * templates.length)];
        return generator();
    }

    // Initialize and generate the first question
    function generateQuestion() {
        document.getElementById('feedback-container').innerHTML = '';
        const input = document.getElementById('answer-input');
        input.value = '';
        input.disabled = false;
        document.getElementById('submit-btn').style.display = 'inline-block';
        document.getElementById('next-btn').style.display = 'none';
        
        input.focus();

        // Generate the new expression
        let mathData = generateExpressionData();
        currentTex = mathData.tex;
        currentAns = mathData.ans;

        // Display question using LaTeX notation
        const qHTML = `$$ ${currentTex} = \\text{?} $$`;
        document.getElementById('question-container').innerHTML = qHTML;
        
        // Re-render MathJax
        if (window.MathJax) {
            MathJax.typesetPromise();
        }
    }

    // Check user input against the calculated answer
    function checkAnswer() {
        const inputElement = document.getElementById('answer-input');
        const userAns = parseInt(inputElement.value);
        const feedback = document.getElementById('feedback-container');

        if (isNaN(userAns)) {
            alert("Please enter a valid number.");
            return;
        }

        inputElement.disabled = true;
        document.getElementById('submit-btn').style.display = 'none';

        if (userAns === currentAns) {
            // Correct Sequence
            feedback.innerHTML = `
                <div class="correct">
                    Correct! Great job. <br>
                    <span style="font-size: 0.9em; color: #555;">Loading next question...</span>
                </div>`;
            
            setTimeout(generateQuestion, 500);
            
        } else {
            // Incorrect Sequence (Displays Answer and Order of Operations logic)
            let steps = `<div class="incorrect-container">`;
            steps += `<p class="incorrect-title">Incorrect. The right answer is:</p>`;
            steps += `$$ ${currentTex} = \\mathbf{${currentAns}} $$`;
            
            steps += `<div style="margin-top: 1.5rem; font-size: 0.95rem; color: #444; background: #f8f9fa; padding: 12px; border-radius: 6px; border: 1px solid #e2e2e2;">`;
            steps += `<strong style="color: #333;">Reminder - Order of Operations (PEMDAS):</strong><br><br>`;
            steps += `<strong>1.</strong> Parentheses <strong>( )</strong><br>`;
            steps += `<strong>2.</strong> Exponents<br>`;
            steps += `<strong>3.</strong> Multiplication <strong>&times;</strong> & Division <strong>&divide;</strong> (Left to Right)<br>`;
            steps += `<strong>4.</strong> Addition <strong>+</strong> & Subtraction <strong>&minus;</strong> (Left to Right)`;
            steps += `</div>`;
            steps += `</div>`;

            feedback.innerHTML = steps;
            
            document.getElementById('next-btn').style.display = 'inline-block';
            
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }
    }

    document.getElementById('answer-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            checkAnswer();
        }
    });

    window.onload = generateQuestion;
</script>

</body>
</html>
