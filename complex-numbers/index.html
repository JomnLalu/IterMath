<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Complex numbers practice · IterMath</title>
  <meta name="description" content="Add, subtract, multiply and divide complex numbers, and simplify powers of i. Instant feedback and a worked solution for every miss.">
  <link rel="canonical" href="https://itermath.jomontolalu.com/complex-numbers">
  <meta name="theme-color" content="#fafafa">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="IterMath">
  <meta property="og:title" content="Complex numbers practice · IterMath">
  <meta property="og:description" content="Add, subtract, multiply and divide complex numbers, and simplify powers of i. Instant feedback and a worked solution for every miss.">
  <meta property="og:url" content="https://itermath.jomontolalu.com/complex-numbers">
  <meta property="og:image" content="https://itermath.jomontolalu.com/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

</head>
<body>
  <header class="container container--narrow topbar">
    <a class="back" href="/" aria-label="All modules"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg><img src="/assets/itermath-logo.svg" alt="" width="104" height="37"></a>
  </header>

  <main class="container container--narrow">
    <div class="practice-header">
      <p class="eyebrow small muted">Advanced algebra and trigonometry · Grades 10–12</p>
      <h1 class="h1">Complex numbers</h1>
      <p class="lead">Add, subtract, multiply and divide complex numbers, and simplify powers of i.</p>
    </div>

    <section class="card panel" aria-label="Exercise">
      <p id="question" class="question" aria-live="polite"></p>
      <form id="form" novalidate autocomplete="off">
        <label for="answer" class="visually-hidden">Your answer</label>
        <div class="answer-row">
          <input id="answer" class="input" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="3 + 2i" aria-describedby="hint error">
          <button id="action" class="btn" type="submit">Check</button>
        </div>
        <p id="hint" class="field-hint small muted">Type it like 3 + 2i or 4 - i.</p>
        <p id="error" class="field-error" role="alert" hidden></p>
      </form>
      <div id="feedback" class="feedback" aria-live="polite"></div>
    </section>
  </main>

  <script src="/assets/practice.js"></script>
  <script>
    (function (M) {
      M.practice({
        input: 'number',
        generate: function () {
          var n = M.num, I = '<i>i</i>', t = M.rand(1, 6);
          var cx = function (re, im) { return M.terms([[re, ''], [im, I]]); };
          var txt = function (re, im) { return re + (im < 0 ? '-' : '+') + Math.abs(im) + 'i'; };
          var a = M.randNZ(-9, 9), b = M.randNZ(-9, 9), c = M.randNZ(-9, 9), d = M.randNZ(-9, 9), re, im, q, rows;
          if (t === 1 || t === 2) {
            var s = t === 1 ? 1 : -1; re = a + s * c; im = b + s * d;
            q = '(' + cx(a, b) + ') ' + (s > 0 ? '+' : '−') + ' (' + cx(c, d) + ')';
            rows = [[q, '= (' + n(a) + (s > 0 ? ' + ' : ' − ') + M.operand(c) + ') + (' + n(b) + (s > 0 ? ' + ' : ' − ') + M.operand(d) + ')' + I]];
          } else if (t === 3) {
            a = M.randNZ(-6, 6); b = M.randNZ(-6, 6); c = M.randNZ(-6, 6); d = M.randNZ(-6, 6);
            re = a * c - b * d; im = a * d + b * c;
            q = '(' + cx(a, b) + ')(' + cx(c, d) + ')';
            rows = [[q, '= ' + M.terms([[a * c, ''], [a * d, I], [b * c, I], [b * d, M.pow(I, 2)]])], ['', '= ' + M.terms([[a * c, ''], [a * d + b * c, I], [-b * d, '']]) + ' (since ' + M.pow(I, 2) + ' = −1)']];
          } else if (t === 4) {
            var p = M.rand(2, 60), cyc = [[1, 0], [0, 1], [-1, 0], [0, -1]][p % 4];
            re = cyc[0]; im = cyc[1]; q = M.pow(I, p);
            rows = [[q, '= ' + M.pow(I, 4 * Math.floor(p / 4) + ' + ' + (p % 4))], ['', '= ' + M.pow(I, p % 4)]];
            return { question: q, answer: txt(re, im), sample: re ? String(re) : (im > 0 ? 'i' : '-i'), check: M.complexCheck(re, im), display: cx(re, im), solution: M.steps(rows.concat([['', '= <strong>' + cx(re, im) + '</strong>']])) + M.note('Powers of ' + I + ' repeat every 4: ' + I + ', −1, −' + I + ', 1.') };
          } else if (t === 5) {
            re = a * a + b * b; im = 0;
            q = '(' + cx(a, b) + ')(' + cx(a, -b) + ')';
            rows = [[q, '= ' + M.pow(M.operand(a), 2) + ' + ' + M.pow(M.operand(b), 2)]];
          } else {
            var pr = M.randNZ(-5, 5), pi = M.randNZ(-5, 5); c = M.randNZ(-4, 4); d = M.randNZ(-4, 4);
            var nr = pr * c - pi * d, ni = pr * d + pi * c, den = c * c + d * d;
            re = pr; im = pi;
            q = M.frac(cx(nr, ni), cx(c, d));
            rows = [[q, '= ' + M.frac('(' + cx(nr, ni) + ')(' + cx(c, -d) + ')', '(' + cx(c, d) + ')(' + cx(c, -d) + ')')], ['', '= ' + M.frac(cx(pr * den, pi * den), den)]];
          }
          rows.push(['', '= <strong>' + cx(re, im) + '</strong>']);
          return { question: q, answer: txt(re, im), sample: txt(re, im), check: M.complexCheck(re, im), display: cx(re, im), solution: M.steps(rows) + (t === 6 ? M.note('Multiply the top and bottom by the conjugate of the denominator.') : '') };
        }
      });
    })(IterMath);
  </script>
</body>
</html>
