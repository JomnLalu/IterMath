<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Prime factorization practice · IterMath</title>
  <meta name="description" content="Write a number as a product of prime factors. Instant feedback and a worked solution for every miss.">
  <link rel="canonical" href="https://itermath.jomontolalu.com/prime-factorization">
  <meta name="theme-color" content="#fafafa">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="IterMath">
  <meta property="og:title" content="Prime factorization practice · IterMath">
  <meta property="og:description" content="Write a number as a product of prime factors. Instant feedback and a worked solution for every miss.">
  <meta property="og:url" content="https://itermath.jomontolalu.com/prime-factorization">
  <meta property="og:image" content="https://itermath.jomontolalu.com/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="container container--narrow topbar">
    <a class="back" href="/" aria-label="All modules"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg><img src="/assets/itermath-logo.svg" alt="" width="104" height="37"></a>
  </header>

  <main class="container container--narrow">
    <div class="practice-header">
      <p class="eyebrow small muted">Integers, powers and factors · Grades 5–7</p>
      <h1 class="h1">Prime factorization</h1>
      <p class="lead">Write a number as a product of prime factors.</p>
    </div>

    <section class="card panel" aria-label="Exercise">
      <p id="question" class="question" aria-live="polite"></p>
      <form id="form" novalidate autocomplete="off">
        <label for="answer" class="visually-hidden">Your answer</label>
        <div class="answer-row">
          <input id="answer" class="input" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="2^3 × 3" aria-describedby="hint error">
          <button id="action" class="btn" type="submit">Check</button>
        </div>
        <p id="hint" class="field-hint small muted">Type like 2^3 × 3 or 2 x 2 x 2 x 3.</p>
        <p id="error" class="field-error" role="alert" hidden></p>
      </form>
      <div id="feedback" class="feedback" aria-live="polite"></div>
    </section>
  </main>

  <script src="/assets/practice.js"></script>
  <script>
    (function (M) {
      M.practice({
        input: 'number',
        generate: function () {
          var nn, k;
          do {
            nn = 1; k = M.rand(3, 5);
            for (var i = 0; i < k; i++) nn *= M.pick([2, 2, 2, 3, 3, 5, 7, 11]);
          } while (nn < 12 || nn > 600);
          var f = M.primeFactors(nn), grouped = [], text = [], j = 0;
          while (j < f.length) {
            var e = j; while (e < f.length && f[e] === f[j]) e++;
            grouped.push(e - j > 1 ? M.pow(f[j], e - j) : String(f[j]));
            text.push(e - j > 1 ? f[j] + '^' + (e - j) : String(f[j]));
            j = e;
          }
          var rows = [], cur = nn;
          f.forEach(function (p) { rows.push([cur + ' ÷ ' + p, '= ' + cur / p]); cur /= p; });
          return {
            prompt: 'Write as a product of prime factors.',
            question: String(nn),
            answer: text.join(' × '),
            sample: text.join(' x '),
            display: grouped.join(' × '),
            check: function (raw) {
              var s = raw.replace(/²/g, '^2').replace(/³/g, '^3').replace(/⁴/g, '^4').replace(/⁵/g, '^5').replace(/⁶/g, '^6').replace(/\s*\^\s*/g, '^');
              var toks = s.split(/\s*[×xX*·.]\s*|\s+/).filter(Boolean), prod = 1, allPrime = true;
              for (var t = 0; t < toks.length; t++) {
                var m = /^(\d+)(?:\^(\d+))?$/.exec(toks[t]);
                if (!m) return 'Type it like 2^3 × 3 or 2 x 2 x 2 x 3.';
                if (!M.isPrime(parseInt(m[1], 10))) allPrime = false;
                prod *= Math.pow(parseInt(m[1], 10), m[2] ? parseInt(m[2], 10) : 1);
              }
              if (prod !== nn) return false;
              return allPrime ? true : 'That multiplies to ' + nn + ', but every factor must be prime.';
            },
            solution: M.steps(rows) + M.note('Divide by the smallest prime that fits until you reach 1: ' + nn + ' = <strong>' + grouped.join(' × ') + '</strong>.')
          };
        }
      });
    })(IterMath);
  </script>
</body>
</html>
